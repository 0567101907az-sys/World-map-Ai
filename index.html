<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD MAP AI</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 18px;
      background: #0b1728;
      border-bottom: 1px solid #20324a;
    }

    h1 { margin: 0; font-size: 25px; }

    header p {
      margin: 6px 0 0;
      color: #9fb2c8;
    }

    .search {
      display: flex;
      gap: 8px;
      padding: 14px;
      background: #0b1728;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #30445d;
      background: #111f31;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #238636;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    #status {
      padding: 10px 14px;
      color: #9fb2c8;
      background: #07111f;
    }

    #map {
      width: 100%;
      height: 62vh;
      min-height: 400px;
    }

    #results {
      padding: 12px;
      background: #0b1728;
    }

    .result {
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #263a53;
      border-radius: 12px;
      background: #111f31;
    }

    .result strong {
      display: block;
      margin-bottom: 5px;
    }

    .result small {
      color: #9fb2c8;
    }

    .empty {
      text-align: center;
      color: #7f93aa;
      padding: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 WORLD MAP AI</h1>
  <p>مساعدك الجغرافي الذكي</p>
</header>

<div class="search">
  <input
    id="searchInput"
    placeholder="🔎 مثال: مستشفيات نابلس"
    autocomplete="off"
  >
  <button onclick="smartSearch()">بحث</button>
</div>

<div id="status">
  جرّب: مستشفيات نابلس أو جامعات لندن
</div>

<div id="map"></div>

<div id="results">
  <div class="empty">نتائج البحث ستظهر هنا</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([31.95, 35.91], 7);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

let markers = [];

const categories = {

  "مستشفى": {
    ar: "مستشفى",
    tags: [
      '["amenity"="hospital"]'
    ]
  },

  "مستشفيات": {
    ar: "مستشفى",
    tags: [
      '["amenity"="hospital"]'
    ]
  },

  "hospital": {
    ar: "مستشفى",
    tags: [
      '["amenity"="hospital"]'
    ]
  },

  "hospitals": {
    ar: "مستشفى",
    tags: [
      '["amenity"="hospital"]'
    ]
  },

  "جامعة": {
    ar: "جامعة",
    tags: [
      '["amenity"="university"]'
    ]
  },

  "جامعات": {
    ar: "جامعة",
    tags: [
      '["amenity"="university"]'
    ]
  },

  "university": {
    ar: "جامعة",
    tags: [
      '["amenity"="university"]'
    ]
  },

  "universities": {
    ar: "جامعة",
    tags: [
      '["amenity"="university"]'
    ]
  },

  "مدرسة": {
    ar: "مدرسة",
    tags: [
      '["amenity"="school"]'
    ]
  },

  "مدارس": {
    ar: "مدرسة",
    tags: [
      '["amenity"="school"]'
    ]
  },

  "school": {
    ar: "مدرسة",
    tags: [
      '["amenity"="school"]'
    ]
  },

  "schools": {
    ar: "مدرسة",
    tags: [
      '["amenity"="school"]'
    ]
  },

  "مسجد": {
    ar: "مسجد",
    tags: [
      '["amenity"="place_of_worship"]["religion"="muslim"]',
      '["amenity"="place_of_worship"]'
    ]
  },

  "مساجد": {
    ar: "مسجد",
    tags: [
      '["amenity"="place_of_worship"]["religion"="muslim"]',
      '["amenity"="place_of_worship"]'
    ]
  },

  "mosque": {
    ar: "مسجد",
    tags: [
      '["amenity"="place_of_worship"]["religion"="muslim"]',
      '["amenity"="place_of_worship"]'
    ]
  },

  "mosques": {
    ar: "مسجد",
    tags: [
      '["amenity"="place_of_worship"]["religion"="muslim"]',
      '["amenity"="place_of_worship"]'
    ]
  },

  "ملعب": {
    ar: "ملعب",
    tags: [
      '["leisure"="stadium"]'
    ]
  },

  "ملاعب": {
    ar: "ملعب",
    tags: [
      '["leisure"="stadium"]'
    ]
  },

  "stadium": {
    ar: "ملعب",
    tags: [
      '["leisure"="stadium"]'
    ]
  },

  "stadiums": {
    ar: "ملعب",
    tags: [
      '["leisure"="stadium"]'
    ]
  }

};


function clearMarkers() {

  markers.forEach(marker => {
    map.removeLayer(marker);
  });

  markers = [];
}


function escapeHTML(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function findCategory(text) {

  const words = text.toLowerCase().split(/\s+/);

  for (const word of words) {

    if (categories[word]) {
      return {
        key: word,
        data: categories[word]
      };
    }

  }

  for (const key in categories) {

    if (text.toLowerCase().includes(key)) {
      return {
        key: key,
        data: categories[key]
      };
    }

  }

  return null;
}


async function geocode(placeName) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(placeName);

  const response = await fetch(url, {
    headers: {
      "Accept": "application/json"
    }
  });

  if (!response.ok) {
    throw new Error("Geocoding failed");
  }

  const data = await response.json();

  if (!data.length) {
    throw new Error("Location not found");
  }

  return data[0];
}


async function searchPlaces(lat, lon, tags) {

  let queryParts = [];

  tags.forEach(tag => {

    queryParts.push(`
      node${tag}(around:10000,${lat},${lon});
      way${tag}(around:10000,${lat},${lon});
      relation${tag}(around:10000,${lat},${lon});
    `);

  });

  const query = `
    [out:json][timeout:30];
    (
      ${queryParts.join("")}
    );
    out center tags;
  `;

  const servers = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  for (const server of servers) {

    try {

      const response = await fetch(server, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: query
      });

      if (!response.ok) continue;

      const data = await response.json();

      return data.elements || [];

    } catch (error) {

      console.log("Overpass server failed:", server);

    }

  }

  throw new Error("All map servers failed");
}


async function smartSearch() {

  const input = document
    .getElementById("searchInput")
    .value
    .trim();

  const status = document.getElementById("status");
  const results = document.getElementById("results");

  if (!input) {

    status.textContent = "اكتب طلب البحث أولًا 🔎";
    return;

  }

  status.textContent = "🤖 WORLD MAP AI يفهم طلبك...";

  results.innerHTML = "";

  clearMarkers();

  try {

    const category = findCategory(input);

    let locationText = input;

    if (category) {

      locationText = input
        .replace(new RegExp(category.key, "ig"), "")
        .replace("في", "")
        .replace("حول", "")
        .replace("near", "")
        .replace("in", "")
        .trim();

    }

    if (!locationText) {

      locationText = input;

    }

    status.textContent =
      "📍 أبحث عن الموقع: " + locationText;

    const location = await geocode(locationText);

    const lat = Number(location.lat);
    const lon = Number(location.lon);

    map.setView([lat, lon], 12);

    if (!category) {

      const marker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup(
          "<strong>" +
          escapeHTML(location.display_name) +
          "</strong>"
        )
        .openPopup();

      markers.push(marker);

      status.textContent =
        "📍 تم العثور على: " +
        location.display_name;

      results.innerHTML = `
        <div class="result">
          <strong>${escapeHTML(location.name || location.display_name)}</strong>
          <small>${escapeHTML(location.display_name)}</small>
        </div>
      `;

      return;

    }

    status.textContent =
      "🔎 أبحث عن " +
      category.data.ar +
      " بالقرب من " +
      locationText +
      "...";

    let elements = await searchPlaces(
      lat,
      lon,
      category.data.tags
    );

    // إزالة التكرارات
    const unique = [];
    const seen = new Set();

    elements.forEach(element => {

      const id = element.type + "/" + element.id;

      if (!seen.has(id)) {

        seen.add(id);
        unique.push(element);

      }

    });

    if (!unique.length) {

      status.textContent =
        "❌ لم نجد نتائج قريبة.";

      results.innerHTML =
        '<div class="empty">جرّب مدينة أخرى أو نوع مكان آخر.</div>';

      return;

    }

    const bounds = [];

    unique.forEach((element, index) => {

      let point;

      if (element.type === "node") {

        point = [
          element.lat,
          element.lon
        ];

      } else if (element.center) {

        point = [
          element.center.lat,
          element.center.lon
        ];

      } else {

        return;

      }

      const tags = element.tags || {};

      const name =
        tags.name ||
        tags["name:en"] ||
        category.data.ar;

      const marker = L.marker(point)
        .addTo(map)
        .bindPopup(
          "<strong>" +
          escapeHTML(name) +
          "</strong>"
        );

      markers.push(marker);

      bounds.push(point);

      const item = document.createElement("div");

      item.className = "result";

      item.innerHTML = `
        <strong>${index + 1}. ${escapeHTML(name)}</strong>
        <small>${escapeHTML(
          tags["addr:street"] ||
          tags["addr:city"] ||
          category.data.ar
        )}</small>
      `;

      item.onclick = () => {

        map.setView(point, 16);
        marker.openPopup();

      };

      results.appendChild(item);

    });

    if (bounds.length > 0) {

      map.fitBounds(bounds, {
        padding: [30, 30]
      });

    }

    status.textContent =
      `✅ وجدنا ${unique.length} نتيجة`;

  } catch (error) {

    console.error(error);

    status.textContent =
      "⚠️ حدث خطأ أثناء البحث.";

    results.innerHTML = `
      <div class="empty">
        تعذر تنفيذ البحث. جرّب اسم مدينة واضح مثل:
        نابلس، لندن، عمّان، باريس
      </div>
    `;

  }

}


document
  .getElementById("searchInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      smartSearch();
    }

  });

</script>

</body>
</html>
