<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WORLD MAP AI</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      background: #111c31;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #263653;
    }

    .subtitle {
      font-size: 13px;
      color: #9fb0c9;
      margin-top: 5px;
    }

    .search-box {
      padding: 15px;
      background: #0f192b;
    }

    #searchInput {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334563;
      background: #17243a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #searchInput::placeholder {
      color: #8b9ab2;
    }

    #searchBtn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchBtn:active {
      transform: scale(0.98);
    }

    .examples {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
    }

    .example {
      white-space: nowrap;
      background: #1a2942;
      border: 1px solid #334563;
      color: #dbe7f8;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    #status {
      padding: 10px 15px;
      color: #9fb0c9;
      font-size: 14px;
      min-height: 35px;
    }

    #map {
      width: 100%;
      height: 58vh;
      min-height: 400px;
    }

    #results {
      padding: 15px;
      background: #0b1220;
    }

    .result {
      background: #131f34;
      border: 1px solid #263653;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .result:hover {
      background: #192943;
    }

    .result-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .result-address {
      color: #9fb0c9;
      font-size: 13px;
      line-height: 1.5;
    }

    .leaflet-control-layers {
      border-radius: 10px !important;
      overflow: hidden;
    }

    .leaflet-control-layers-toggle {
      width: 40px !important;
      height: 40px !important;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #65758f;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  🌍 WORLD MAP AI
  <div class="subtitle">خريطة ذكية للعالم</div>
</header>

<div class="search-box">

  <input
    id="searchInput"
    type="text"
    placeholder="مثال: مستشفيات نابلس أو جامعات لندن"
  >

  <button id="searchBtn" onclick="smartSearch()">
    🔎 بحث
  </button>

  <div class="examples">
    <div class="example" onclick="setSearch('مستشفيات نابلس')">
      🏥 مستشفيات نابلس
    </div>

    <div class="example" onclick="setSearch('جامعات لندن')">
      🎓 جامعات لندن
    </div>

    <div class="example" onclick="setSearch('مساجد القدس')">
      🕌 مساجد القدس
    </div>

    <div class="example" onclick="setSearch('مدارس حول نابلس')">
      🏫 مدارس نابلس
    </div>

    <div class="example" onclick="setSearch('stadiums in Barcelona')">
      🏟️ ملاعب برشلونة
    </div>
  </div>

</div>

<div id="status">
  جاهز للبحث 🌍
</div>

<div id="map"></div>

<div id="results"></div>

<footer>
  WORLD MAP AI — OpenStreetMap & Esri
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // =========================
  // الخريطة
  // =========================

  const street = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  );

  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  );

  const terrain = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 13,
      attribution: "Tiles &copy; Esri"
    }
  );

  const map = L.map("map", {
    center: [31.95, 35.91],
    zoom: 7,
    layers: [street]
  });

  // قائمة تغيير نوع الخريطة
  const mapTypes = {
    "🗺️ الشوارع": street,
    "🛰️ قمر صناعي": satellite,
    "⛰️ تضاريس": terrain
  };

  L.control.layers(
    mapTypes,
    null,
    {
      position: "topright"
    }
  ).addTo(map);


  // =========================
  // المتغيرات
  // =========================

  let markers = [];


  // =========================
  // أنواع الأماكن
  // =========================

  const categories = {

    hospital: [
      "مستشفى",
      "مستشفيات",
      "hospital",
      "hospitals"
    ],

    university: [
      "جامعة",
      "جامعات",
      "university",
      "universities"
    ],

    school: [
      "مدرسة",
      "مدارس",
      "school",
      "schools"
    ],

    mosque: [
      "مسجد",
      "مساجد",
      "mosque",
      "mosques"
    ],

    stadium: [
      "ملعب",
      "ملاعب",
      "stadium",
      "stadiums"
    ],

    police: [
      "شرطة",
      "مركز شرطة",
      "police"
    ],

    pharmacy: [
      "صيدلية",
      "صيدليات",
      "pharmacy",
      "pharmacies"
    ],

    hotel: [
      "فندق",
      "فنادق",
      "hotel",
      "hotels"
    ],

    restaurant: [
      "مطعم",
      "مطاعم",
      "restaurant",
      "restaurants"
    ],

    airport: [
      "مطار",
      "مطارات",
      "airport",
      "airports"
    ]
  };


  // =========================
  // تنظيف العلامات
  // =========================

  function clearMarkers() {

    markers.forEach(function(marker) {
      map.removeLayer(marker);
    });

    markers = [];
  }


  // =========================
  // حماية النص
  // =========================

  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // =========================
  // معرفة نوع المكان
  // =========================

  function findCategory(text) {

    const lower = text.toLowerCase();

    for (const category in categories) {

      for (const word of categories[category]) {

        if (lower.includes(word.toLowerCase())) {
          return category;
        }

      }

    }

    return null;
  }


  // =========================
  // تحويل النوع إلى OSM tags
  // =========================

  function getTags(category) {

    if (category === "hospital") {
      return [
        '[amenity="hospital"]'
      ];
    }

    if (category === "university") {
      return [
        '[amenity="university"]'
      ];
    }

    if (category === "school") {
      return [
        '[amenity="school"]'
      ];
    }

    if (category === "mosque") {
      return [
        '[amenity="place_of_worship"][religion="muslim"]',
        '[amenity="place_of_worship"]'
      ];
    }

    if (category === "stadium") {
      return [
        '[leisure="stadium"]'
      ];
    }

    if (category === "police") {
      return [
        '[amenity="police"]'
      ];
    }

    if (category === "pharmacy") {
      return [
        '[amenity="pharmacy"]'
      ];
    }

    if (category === "hotel") {
      return [
        '[tourism="hotel"]'
      ];
    }

    if (category === "restaurant") {
      return [
        '[amenity="restaurant"]'
      ];
    }

    if (category === "airport") {
      return [
        '[aeroway="aerodrome"]'
      ];
    }

    return [];
  }


  // =========================
  // البحث عن المدينة
  // =========================

  async function geocode(placeName) {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(placeName);

    const response = await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("Geocoding failed");
    }

    const data = await response.json();

    if (!data.length) {
      return null;
    }

    return {
      lat: parseFloat(data[0].lat),
      lon: parseFloat(data[0].lon),
      display: data[0].display_name
    };
  }


  // =========================
  // البحث عن الأماكن عبر Overpass
  // =========================

  async function searchPlaces(lat, lon, tags) {

    const servers = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];

    for (const server of servers) {

      try {

        let queryParts = [];

        tags.forEach(function(tag) {

          queryParts.push(
            `node(around:10000,${lat},${lon})${tag};`
          );

          queryParts.push(
            `way(around:10000,${lat},${lon})${tag};`
          );

          queryParts.push(
            `relation(around:10000,${lat},${lon})${tag};`
          );

        });

        const query = `
          [out:json][timeout:25];
          (
            ${queryParts.join("\n")}
          );
          out center tags;
        `;

        const response = await fetch(server, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: "data=" + encodeURIComponent(query)
        });

        if (!response.ok) {
          continue;
        }

        const data = await response.json();

        return data.elements || [];

      } catch (error) {

        console.log("Overpass server failed:", server);

      }

    }

    throw new Error("All Overpass servers failed");
  }


  // =========================
  // البحث الذكي
  // =========================

  async function smartSearch() {

    const input =
      document.getElementById("searchInput").value.trim();

    const status =
      document.getElementById("status");

    const results =
      document.getElementById("results");


    if (!input) {

      status.innerText =
        "اكتب شيئاً للبحث 🔎";

      return;
    }


    clearMarkers();

    results.innerHTML = "";

    status.innerText =
      "🔎 جاري فهم طلبك...";


    try {

      // معرفة نوع المكان
      const category =
        findCategory(input);


      // إذا لم نجد نوع مكان
      if (!category) {

        const place =
          await geocode(input);

        if (!place) {

          status.innerText =
            "❌ لم أجد هذا المكان.";

          return;
        }


        map.setView(
          [place.lat, place.lon],
          12
        );


        const marker =
          L.marker([
            place.lat,
            place.lon
          ]).addTo(map);


        marker.bindPopup(
          "<b>" +
          escapeHTML(place.display) +
          "</b>"
        );


        markers.push(marker);


        status.innerText =
          "📍 تم العثور على المكان";

        return;
      }


      // =========================
      // استخراج اسم الموقع
      // =========================

      let locationText = input;


      for (const wordList of Object.values(categories)) {

        wordList.forEach(function(word) {

          const regex =
            new RegExp(
              word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
              "gi"
            );

          locationText =
            locationText.replace(regex, "");

        });

      }


      locationText =
        locationText
          .replace(/\bفي\b/gi, "")
          .replace(/\bحول\b/gi, "")
          .replace(/\bnear\b/gi, "")
          .replace(/\bin\b/gi, "")
          .replace(/\s+/g, " ")
          .trim();


      if (!locationText) {

        status.innerText =
          "⚠️ اكتب اسم المدينة أو المنطقة.";

        return;
      }


      // =========================
      // تحديد الموقع
      // =========================

      status.innerText =
        "🌍 أبحث عن " +
        locationText +
        "...";


      const place =
        await geocode(locationText);


      if (!place) {

        status.innerText =
          "❌ لم أجد المنطقة المطلوبة.";

        return;
      }


      // =========================
      // البحث عن الأماكن
      // =========================

      status.innerText =
        "🔎 أبحث عن الأماكن الحقيقية...";


      const tags =
        getTags(category);


      let elements =
        await searchPlaces(
          place.lat,
          place.lon,
          tags
        );


      // إزالة التكرار
      const unique = new Map();


      elements.forEach(function(element) {

        const name =
          element.tags &&
          element.tags.name
            ? element.tags.name
            : "مكان بدون اسم";


        const lat =
          element.lat !== undefined
            ? element.lat
            : element.center?.lat;


        const lon =
          element.lon !== undefined
            ? element.lon
            : element.center?.lon;


        if (
          lat !== undefined &&
          lon !== undefined
        ) {

          const key =
            name +
            "|" +
            lat +
            "|" +
            lon;


          unique.set(key, {
            name,
            lat,
            lon,
            tags: element.tags || {}
          });

        }

      });


      elements =
        Array.from(unique.values());


      // =========================
      // عرض النتائج
      // =========================

      if (!elements.length) {

        status.innerText =
          "😕 لم أجد نتائج قريبة في قاعدة البيانات.";

        map.setView(
          [place.lat, place.lon],
          12
        );

        return;
      }


      const bounds = [];


      elements.forEach(function(item, index) {

        const marker =
          L.marker([
            item.lat,
            item.lon
          ]).addTo(map);


        marker.bindPopup(
          "<b>" +
          escapeHTML(item.name) +
          "</b><br><br>" +
          "📍 " +
          item.lat.toFixed(5) +
          ", " +
          item.lon.toFixed(5)
        );


        markers.push(marker);


        bounds.push([
          item.lat,
          item.lon
        ]);


        // نتيجة في القائمة
        const div =
          document.createElement("div");


        div.className =
          "result";


        div.innerHTML = `
          <div class="result-title">
            ${index + 1}. ${escapeHTML(item.name)}
          </div>

          <div class="result-address">
            📍 ${item.lat.toFixed(5)},
            ${item.lon.toFixed(5)}
          </div>
        `;


        div.onclick = function() {

          map.setView(
            [item.lat, item.lon],
            16
          );

          marker.openPopup();

        };


        results.appendChild(div);

      });


      // =========================
      // تكبير الخريطة على النتائج
      // =========================

      if (bounds.length === 1) {

        map.setView(
          bounds[0],
          15
        );

      } else {

        map.fitBounds(
          bounds,
          {
            padding: [40, 40]
          }
        );

      }


      status.innerText =
        "✅ وجدت " +
        elements.length +
        " نتيجة حقيقية حول " +
        locationText;


    } catch (error) {

      console.error(error);

      status.innerText =
        "❌ حدث خطأ أثناء البحث. حاول مرة أخرى.";

    }

  }


  // =========================
  // أمثلة البحث
  // =========================

  function setSearch(text) {

    document.getElementById(
      "searchInput"
    ).value = text;

    smartSearch();

  }


  // =========================
  // زر Enter
  // =========================

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          smartSearch();
        }

      }
    );

</script>

</body>
  </html>
