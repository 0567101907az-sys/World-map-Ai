<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TERRA X</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  color:#e9f7ff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

/* =========================
   NORMAL MAP SCREEN
========================= */

#mapScreen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#05080d;
}

.topbar{
  height:62px;
  min-height:62px;
  background:rgba(4,9,15,.96);
  border-bottom:1px solid #173044;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  z-index:1000;
}

.logo{
  font-weight:900;
  letter-spacing:2px;
  font-size:18px;
  white-space:nowrap;
}

.logo span{
  color:#45d9ff;
}

.searchBox{
  flex:1;
  display:flex;
  gap:6px;
}

.searchBox input{
  min-width:0;
  width:100%;
  height:42px;
  border:1px solid #1d4258;
  border-radius:10px;
  background:#08121b;
  color:white;
  outline:none;
  padding:0 12px;
}

.searchBox input:focus{
  border-color:#45d9ff;
  box-shadow:0 0 12px rgba(69,217,255,.15);
}

.iconBtn,
.searchBtn{
  height:42px;
  border:1px solid #1d4258;
  border-radius:10px;
  background:#091722;
  color:#dff8ff;
  padding:0 12px;
}

.searchBtn{
  background:#0b718f;
  border-color:#159fc6;
  font-weight:bold;
}

.iconBtn:active,
.searchBtn:active,
.layerBtn:active,
.actionBtn:active{
  transform:scale(.97);
}

#map{
  flex:1;
  width:100%;
  min-height:0;
}

.bottomPanel{
  background:rgba(4,9,15,.96);
  border-top:1px solid #173044;
  padding:8px;
  z-index:1000;
}

.layerRow{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:7px;
}

.layerRow::-webkit-scrollbar{
  display:none;
}

.layerBtn{
  flex:0 0 auto;
  border:1px solid #1b3c50;
  background:#091722;
  color:#cdebf5;
  border-radius:9px;
  padding:8px 12px;
  font-size:13px;
}

.layerBtn.active{
  background:#0b607a;
  border-color:#2ec7f1;
  color:white;
}

.intelOpen{
  width:100%;
  height:46px;
  border:1px solid #26bde8;
  border-radius:11px;
  background:linear-gradient(90deg,#073447,#0a607a);
  color:white;
  font-weight:900;
  letter-spacing:1px;
}

/* =========================
   INTELLIGENCE SCREEN
========================= */

#intelScreen{
  position:absolute;
  inset:0;
  z-index:5000;
  display:none;
  background:#03070b;
}

.intelLayout{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.intelHeader{
  min-height:58px;
  height:58px;
  background:rgba(2,7,12,.98);
  border-bottom:1px solid #1b465c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 9px;
  z-index:20;
}

.intelTitle{
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px;
}

.intelTitle small{
  display:block;
  color:#54dfff;
  font-size:9px;
  letter-spacing:2px;
  margin-top:3px;
}

.closeIntel{
  border:1px solid #4b2930;
  background:#1b0c11;
  color:#ffb8c2;
  border-radius:9px;
  height:40px;
  padding:0 12px;
}

.intelMapArea{
  position:relative;
  flex:1;
  min-height:0;
}

#intelMap{
  position:absolute;
  inset:0;
}

.targetBadge{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:rgba(2,8,13,.9);
  border:1px solid #1d6179;
  border-radius:9px;
  padding:8px 10px;
  font-size:11px;
  direction:ltr;
}

.targetBadge b{
  color:#4ee1ff;
}

.intelScroll{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:1100;
  max-height:54%;
  overflow-y:auto;
  padding:9px;
  background:linear-gradient(
    transparent,
    rgba(2,6,10,.96) 18%
  );
  padding-top:28px;
}

.statsGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  min-width:0;
  background:rgba(5,15,23,.94);
  border:1px solid #17465a;
  border-radius:10px;
  padding:8px 5px;
  text-align:center;
}

.statLabel{
  font-size:9px;
  color:#81a9b8;
  margin-bottom:5px;
}

.statValue{
  font-size:14px;
  font-weight:900;
  color:#eafcff;
  direction:ltr;
}

.analysisBox{
  margin-top:7px;
  background:rgba(4,12,18,.95);
  border:1px solid #164154;
  border-radius:10px;
  padding:9px;
}

.analysisTop{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#9bc0cc;
  margin-bottom:7px;
}

.progress{
  height:5px;
  background:#091923;
  border-radius:99px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:#35d6ff;
  transition:width .4s ease;
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:7px;
}

.actionBtn{
  min-height:43px;
  border:1px solid #17485c;
  background:#07141e;
  color:#d8f6ff;
  border-radius:9px;
  font-size:11px;
  font-weight:bold;
}

.actionBtn:hover{
  border-color:#32d5ff;
}

.timeline{
  margin-top:7px;
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.timeline::-webkit-scrollbar{
  display:none;
}

.yearBtn{
  flex:1;
  min-width:70px;
  border:1px solid #17475a;
  background:#08141e;
  color:#9fc5d1;
  border-radius:8px;
  padding:8px 5px;
  font-size:10px;
}

.yearBtn.active{
  background:#0a5871;
  border-color:#31d8ff;
  color:white;
}

.resultBox{
  margin-top:7px;
  border:1px solid #17475a;
  border-radius:10px;
  background:rgba(4,12,18,.96);
  padding:10px;
  font-size:11px;
  line-height:1.6;
  color:#b9d9e2;
}

.resultBox strong{
  color:#4cddff;
}

.leaflet-control-attribution{
  font-size:8px !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    height:58px;
    min-height:58px;
  }

  .logo{
    font-size:15px;
  }

  .searchBox{
    gap:4px;
  }

  .searchBox input{
    font-size:13px;
    padding:0 8px;
  }

  .searchBtn{
    padding:0 9px;
  }

  .iconBtn{
    padding:0 9px;
  }

  .statsGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .actionGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .intelScroll{
    max-height:61%;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =========================
       NORMAL MAP
  ========================== -->

  <section id="mapScreen">

    <div class="topbar">

      <div class="logo">
        TERRA <span>X</span>
      </div>

      <div class="searchBox">
        <input
          id="searchInput"
          type="text"
          placeholder="ابحث عن مدينة أو مكان..."
          autocomplete="off"
        >

        <button
          class="searchBtn"
          onclick="searchPlace()"
        >
          بحث
        </button>
      </div>

      <button
        class="iconBtn"
        onclick="getLocation()"
        title="موقعي"
      >
        📍
      </button>

    </div>

    <div id="map"></div>

    <div class="bottomPanel">

      <div class="layerRow">

        <button
          id="streetBtn"
          class="layerBtn active"
          onclick="setLayer('street')"
        >
          🗺️ Street
        </button>

        <button
          id="satelliteBtn"
          class="layerBtn"
          onclick="setLayer('satellite')"
        >
          🛰️ Satellite
        </button>

        <button
          id="terrainBtn"
          class="layerBtn"
          onclick="setLayer('terrain')"
        >
          ⛰️ Terrain
        </button>

      </div>

      <button
        class="intelOpen"
        onclick="openIntelligence()"
      >
        🛰️ OPEN TERRA X INTELLIGENCE
      </button>

    </div>

  </section>


  <!-- =========================
       INTELLIGENCE
  ========================== -->

  <section id="intelScreen">

    <div class="intelLayout">

      <header class="intelHeader">

        <div class="intelTitle">
          TERRA X / INTELLIGENCE
          <small>GEOSPATIAL ANALYSIS SYSTEM</small>
        </div>

        <button
          class="closeIntel"
          onclick="closeIntelligence()"
        >
          ← الخريطة
        </button>

      </header>

      <div class="intelMapArea">

        <div id="intelMap"></div>

        <div class="targetBadge">
          TARGET:
          <b id="targetName">GLOBAL VIEW</b>
        </div>

        <div class="intelScroll">

          <!-- STATS -->

          <div class="statsGrid">

            <div class="stat">
              <div class="statLabel">POPULATION</div>
              <div
                id="populationValue"
                class="statValue"
              >
                —
              </div>
            </div>

            <div class="stat">
              <div class="statLabel">BUILDINGS</div>
              <div
                id="buildingValue"
                class="statValue"
              >
                —
              </div>
            </div>

            <div class="stat">
              <div class="statLabel">AREA</div>
              <div
                id="areaValue"
                class="statValue"
              >
                —
              </div>
            </div>

            <div class="stat">
              <div class="statLabel">DENSITY</div>
              <div
                id="densityValue"
                class="statValue"
              >
                —
              </div>
            </div>

          </div>


          <!-- ANALYSIS -->

          <div class="analysisBox">

            <div class="analysisTop">
              <span id="analysisStatus">
                SYSTEM READY
              </span>

              <span id="analysisPercent">
                0%
              </span>
            </div>

            <div class="progress">
              <div
                id="progressBar"
                class="progressBar"
              ></div>
            </div>

          </div>


          <!-- ACTIONS -->

          <div class="actionGrid">

            <button
              class="actionBtn"
              onclick="populationAnalysis()"
            >
              👥 Population AI
            </button>

            <button
              class="actionBtn"
              onclick="buildingAnalysis()"
            >
              🏢 Building Analysis
            </button>

            <button
              class="actionBtn"
              onclick="vegetationAnalysis()"
            >
              🌿 Vegetation
            </button>

            <button
              class="actionBtn"
              onclick="satelliteCompare()"
            >
              🛰️ Satellite Compare
            </button>

            <button
              class="actionBtn"
              onclick="startDrawing()"
            >
              📐 Draw Area
            </button>

            <button
              class="actionBtn"
              onclick="getLocation()"
            >
              📍 My Location
            </button>

          </div>


          <!-- TIMELINE -->

          <div class="timeline">

            <button
              class="yearBtn"
              onclick="selectYear('2015',this)"
            >
              2015
            </button>

            <button
              class="yearBtn"
              onclick="selectYear('2020',this)"
            >
              2020
            </button>

            <button
              class="yearBtn"
              onclick="selectYear('2025',this)"
            >
              2025
            </button>

            <button
              class="yearBtn active"
              onclick="selectYear('Latest',this)"
            >
              Latest
            </button>

          </div>


          <!-- RESULT -->

          <div
            id="resultBox"
            class="resultBox"
          >
            <strong>TERRA X:</strong>
            اختر إحدى أدوات التحليل لبدء الفحص.
          </div>

        </div>

      </div>

    </div>

  </section>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   TERRA X 4.0
   SINGLE FILE
===================================================== */


/* =========================
   MAP LAYERS
========================= */

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles &copy; Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:13,
    attribution:"Tiles &copy; Esri"
  }
);


/* =========================
   NORMAL MAP
========================= */

const map = L.map(
  "map",
  {
    center:[31.95,35.91],
    zoom:7,
    layers:[street]
  }
);


/* =========================
   INTELLIGENCE MAP
========================= */

const intelMap = L.map(
  "intelMap",
  {
    center:[31.95,35.91],
    zoom:7,
    zoomControl:false,
    layers:[satellite]
  }
);


/* =========================
   VARIABLES
========================= */

let currentLayer = "street";

let userLocation = null;
let userMarker = null;
let accuracyCircle = null;

let intelMarker = null;

let drawing = false;
let points = [];
let pointMarkers = [];
let polygon = null;

let currentTarget = {
  name:"GLOBAL VIEW",
  lat:31.95,
  lon:35.91
};


/* =========================
   LAYER SWITCHER
========================= */

function setLayer(type){

  map.removeLayer(street);
  map.removeLayer(satellite);
  map.removeLayer(terrain);

  document
    .querySelectorAll(".layerBtn")
    .forEach(btn => btn.classList.remove("active"));

  if(type === "street"){
    street.addTo(map);
    document.getElementById("streetBtn").classList.add("active");
  }

  if(type === "satellite"){
    satellite.addTo(map);
    document.getElementById("satelliteBtn").classList.add("active");
  }

  if(type === "terrain"){
    terrain.addTo(map);
    document.getElementById("terrainBtn").classList.add("active");
  }

  currentLayer = type;
}


/* =========================
   INTELLIGENCE OPEN/CLOSE
========================= */

function openIntelligence(){

  document.getElementById("intelScreen").style.display = "block";

  setTimeout(() => {

    intelMap.invalidateSize();

    intelMap.setView(
      map.getCenter(),
      map.getZoom()
    );

  },200);
}


function closeIntelligence(){

  document.getElementById("intelScreen").style.display = "none";

}


/* =========================
   SEARCH
========================= */

async function searchPlace(){

  const input =
    document.getElementById("searchInput");

  const query = input.value.trim();

  if(!query){
    alert("اكتب اسم مكان أولاً.");
    return;
  }

  setAnalysis("SEARCHING LOCATION",10);

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error("Search failed");
    }

    const data =
      await response.json();

    if(!data.length){
      alert("لم يتم العثور على المكان.");
      setAnalysis("NO RESULT",0);
      return;
    }

    const place = data[0];

    const lat = parseFloat(place.lat);
    const lon = parseFloat(place.lon);

    currentTarget = {
      name:place.display_name,
      lat:lat,
      lon:lon
    };

    map.setView([lat,lon],14);

    intelMap.setView([lat,lon],14);

    if(userMarker){
      // keep user marker
    }

    if(intelMarker){
      intelMap.removeLayer(intelMarker);
    }

    intelMarker =
      L.marker([lat,lon])
      .addTo(intelMap)
      .bindPopup(
        "<b>TERRA X TARGET</b><br>" +
        escapeHtml(place.display_name)
      );

    intelMarker.openPopup();

    document.getElementById("targetName").innerText =
      place.display_name
        .split(",")
        .slice(0,2)
        .join(",");

    setAnalysis("TARGET ACQUIRED",100);

    document.getElementById("resultBox").innerHTML =
      "<strong>TARGET ACQUIRED</strong><br>" +
      escapeHtml(place.display_name) +
      "<br><br>" +
      "LAT: " + lat.toFixed(6) +
      "<br>" +
      "LON: " + lon.toFixed(6);

    openIntelligence();

  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء البحث. حاول مرة أخرى."
    );

    setAnalysis("SEARCH ERROR",0);
  }
}


/* =========================
   ENTER KEY SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        searchPlace();
      }

    }
  );


/* =========================
   GEOLOCATION
========================= */

function getLocation(){

  if(!navigator.geolocation){

    alert(
      "تحديد الموقع غير مدعوم في هذا المتصفح."
    );

    return;
  }

  setAnalysis(
    "ACQUIRING GPS LOCATION",
    15
  );

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      userLocation = [lat,lon];

      if(userMarker){
        map.removeLayer(userMarker);
      }

      if(accuracyCircle){
        map.removeLayer(accuracyCircle);
      }

      userMarker =
        L.marker(userLocation)
        .addTo(map)
        .bindPopup(
          "📍 موقعك الحالي"
        );

      accuracyCircle =
        L.circle(
          userLocation,
          {
            radius:accuracy
          }
        ).addTo(map);

      map.setView(
        userLocation,
        15
      );

      intelMap.setView(
        userLocation,
        15
      );

      currentTarget = {
        name:"MY LOCATION",
        lat:lat,
        lon:lon
      };

      document.getElementById(
        "targetName"
      ).innerText = "MY LOCATION";

      if(intelMarker){
        intelMap.removeLayer(intelMarker);
      }

      intelMarker =
        L.marker(userLocation)
        .addTo(intelMap)
        .bindPopup(
          "📍 TERRA X USER LOCATION"
        );

      setAnalysis(
        "GPS LOCK ACQUIRED",
        100
      );

      document.getElementById(
        "resultBox"
      ).innerHTML =
        "<strong>GPS LOCATION</strong><br>" +
        "Latitude: " + lat.toFixed(6) +
        "<br>" +
        "Longitude: " + lon.toFixed(6) +
        "<br>" +
        "Accuracy: ±" +
        Math.round(accuracy) +
        " m";

      openIntelligence();

    },

    error => {

      console.error(error);

      setAnalysis(
        "GPS FAILED",
        0
      );

      alert(
        "تعذر تحديد موقعك. تأكد من السماح للموقع للمتصفح."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );
}


/* =========================
   ANALYSIS STATUS
========================= */

function setAnalysis(
  status,
  percent
){

  document.getElementById(
    "analysisStatus"
  ).innerText = status;

  document.getElementById(
    "analysisPercent"
  ).innerText =
    percent + "%";

  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";
}


/* =========================
   POPULATION AI
========================= */

function populationAnalysis(){

  setAnalysis(
    "RUNNING POPULATION MODEL",
    20
  );

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>POPULATION AI</strong><br>" +
    "يتم تجهيز تقدير سكاني للمنطقة المستهدفة...";

  setTimeout(() => {

    setAnalysis(
      "ANALYSING URBAN DENSITY",
      50
    );

  },500);

  setTimeout(() => {

    setAnalysis(
      "MODEL READY",
      100
    );

    document.getElementById(
      "populationValue"
    ).innerText = "EST.";

    document.getElementById(
      "densityValue"
    ).innerText = "EST.";

    document.getElementById(
      "resultBox"
    ).innerHTML =
      "<strong>POPULATION ESTIMATION</strong><br>" +
      "هذه واجهة تقدير وليست عدًّا مباشرًا للأشخاص.<br><br>" +
      "النسخة الحالية لا تعرض رقمًا مختلقًا. " +
      "سيتم ربطها لاحقًا بمصدر بيانات سكاني حقيقي.";

  },1200);
}


/* =========================
   BUILDING ANALYSIS
========================= */

async function buildingAnalysis(){

  setAnalysis(
    "SCANNING OPENSTREETMAP",
    15
  );

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>BUILDING ANALYSIS</strong><br>" +
    "جارٍ البحث عن المباني المسجلة حول الهدف...";

  try{

    const lat =
      currentTarget.lat;

    const lon =
      currentTarget.lon;

    const query = `
      [out:json][timeout:25];
      (
        way["building"](around:2000,${lat},${lon});
      );
      out ids center;
    `;

    const servers = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.private.coffee/api/interpreter"
    ];

    let data = null;

    for(const server of servers){

      try{

        const response =
          await fetch(
            server +
            "?data=" +
            encodeURIComponent(query),
            {
              headers:{
                "Accept":
                "application/json"
              }
            }
          );

        if(response.ok){

          data =
            await response.json();

          break;
        }

      }catch(error){

        console.log(
          "Overpass failed:",
          server
        );

      }

    }

    if(!data){

      throw new Error(
        "No Overpass server"
      );

    }

    const count =
      data.elements.length;

    setAnalysis(
      "BUILDING SCAN COMPLETE",
      100
    );

    document.getElementById(
      "buildingValue"
    ).innerText =
      count.toLocaleString();

    document.getElementById(
      "resultBox"
    ).innerHTML =
      "<strong>BUILDING ANALYSIS</strong><br>" +
      "المباني المسجلة ضمن دائرة تقريبية 2 كم حول الهدف:<br><br>" +
      "<strong>" +
      count.toLocaleString() +
      "</strong> مبنى<br><br>" +
      "المصدر: OpenStreetMap / Overpass";

  }catch(error){

    console.error(error);

    setAnalysis(
      "BUILDING SCAN FAILED",
      0
    );

    document.getElementById(
      "resultBox"
    ).innerHTML =
      "<strong>BUILDING ANALYSIS</strong><br>" +
      "تعذر الوصول إلى خدمة بيانات المباني حاليًا.";

  }

}

/* =========================
   DRAW AREA
========================= */

function startDrawing(){

  openIntelligence();

  drawing = true;

  points = [];

  pointMarkers.forEach(
    marker =>
    intelMap.removeLayer(marker)
  );

  pointMarkers = [];

  if(polygon){

    intelMap.removeLayer(
      polygon
    );

    polygon = null;
  }

  setAnalysis(
    "DRAW MODE ACTIVE",
    20
  );

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>DRAW AREA</strong><br>" +
    "اضغط على الخريطة لإضافة النقاط.<br>" +
    "أضف 3 نقاط أو أكثر لإغلاق المنطقة.";

  intelMap.once(
    "click",
    addPoint
  );
}


/* =========================
   ADD DRAW POINT
========================= */

function addPoint(e){

  if(!drawing) return;

  points.push([
    e.latlng.lat,
    e.latlng.lng
  ]);

  const marker =
    L.circleMarker(
      e.latlng,
      {
        radius:6
      }
    ).addTo(intelMap);

  pointMarkers.push(marker);

  if(points.length >= 3){

    if(polygon){

      intelMap.removeLayer(
        polygon
      );
    }

    polygon =
      L.polygon(
        points,
        {
          fillOpacity:.18
        }
      ).addTo(intelMap);

    calculateArea();

    drawing = false;

    setAnalysis(
      "AREA ANALYSIS COMPLETE",
      100
    );

  }else{

    setAnalysis(
      "POINT " +
      points.length +
      " / 3",
      points.length * 25
    );

    intelMap.once(
      "click",
      addPoint
    );
  }
}


/* =========================
   AREA CALCULATION
========================= */

function calculateArea(){

  if(!polygon) return;

  const latlngs =
    polygon.getLatLngs()[0];

  let area = 0;

  for(
    let i=0;
    i<latlngs.length;
    i++
  ){

    const p1 =
      latlngs[i];

    const p2 =
      latlngs[
        (i+1) %
        latlngs.length
      ];

    area +=
      (p2.lng-p1.lng) *
      (p1.lat+p2.lat);
  }

  area =
    Math.abs(area) *
    12364 /
    2;

  const rounded =
    area.toFixed(2);

  document.getElementById(
    "areaValue"
  ).innerText =
    rounded + " km²";

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>AREA ANALYSIS</strong><br>" +
    "Estimated area:<br><br>" +
    "<strong>" +
    rounded +
    " km²" +
    "</strong><br><br>" +
    "تم حساب المساحة تقريبياً من المضلع المرسوم.";

}
