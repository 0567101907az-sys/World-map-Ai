<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TERRA X 5.0</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03070b;
  color:#eafaff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

/* =====================================================
   NORMAL MAP
===================================================== */

#mapScreen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:62px;
  min-height:62px;
  z-index:2000;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:rgba(3,8,13,.97);
  border-bottom:1px solid #17384b;
}

.logo{
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  white-space:nowrap;
}

.logo span{
  color:#3fdcff;
}

.searchBox{
  flex:1;
  min-width:0;
  display:flex;
  gap:5px;
}

.searchBox input{
  width:100%;
  min-width:0;
  height:42px;
  border:1px solid #1b455a;
  border-radius:10px;
  background:#07131c;
  color:white;
  outline:none;
  padding:0 11px;
}

.searchBox input:focus{
  border-color:#35d5ff;
  box-shadow:0 0 14px rgba(53,213,255,.15);
}

.btn{
  height:42px;
  border:1px solid #1c465a;
  border-radius:10px;
  background:#091721;
  color:#dff8ff;
  padding:0 11px;
}

.searchBtn{
  background:#075b75;
  border-color:#27c8ef;
  font-weight:bold;
}

#map{
  flex:1;
  min-height:0;
}

.bottomPanel{
  z-index:2000;
  background:rgba(3,8,13,.97);
  border-top:1px solid #17384b;
  padding:8px;
}

.layerRow{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:7px;
}

.layerRow::-webkit-scrollbar,
.categoryRow::-webkit-scrollbar{
  display:none;
}

.layerBtn,
.categoryBtn{
  flex:0 0 auto;
  border:1px solid #1b4053;
  background:#08151e;
  color:#cdeaf3;
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
}

.layerBtn.active{
  background:#07566e;
  border-color:#31d7ff;
  color:white;
}

.categoryRow{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:7px;
}

.categoryBtn{
  font-size:11px;
}

.intelOpen{
  width:100%;
  height:45px;
  border:1px solid #28d2ff;
  border-radius:10px;
  color:white;
  font-weight:900;
  background:linear-gradient(90deg,#063448,#0a6078);
}

/* =====================================================
   SEARCH RESULTS
===================================================== */

#resultsPanel{
  position:absolute;
  top:68px;
  right:7px;
  left:7px;
  z-index:2500;
  max-height:48%;
  overflow:auto;
  display:none;
  background:rgba(3,9,14,.97);
  border:1px solid #1c5268;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.resultItem{
  padding:11px;
  border-bottom:1px solid #143241;
}

.resultItem:last-child{
  border-bottom:0;
}

.resultName{
  color:#ecfbff;
  font-weight:bold;
  font-size:13px;
}

.resultMeta{
  color:#7faab7;
  font-size:10px;
  margin-top:4px;
}

.resultOpen{
  margin-top:7px;
  border:1px solid #1e647b;
  background:#071923;
  color:#55dcff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
}

/* =====================================================
   INTELLIGENCE
===================================================== */

#intelScreen{
  position:absolute;
  inset:0;
  z-index:5000;
  display:none;
  background:#02060a;
}

.intelLayout{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.intelHeader{
  height:58px;
  min-height:58px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 9px;
  background:rgba(2,7,12,.98);
  border-bottom:1px solid #19465a;
}

.intelTitle{
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px;
}

.intelTitle small{
  display:block;
  margin-top:3px;
  color:#4bdcff;
  font-size:8px;
  letter-spacing:2px;
}

.closeIntel{
  height:40px;
  border:1px solid #542b35;
  border-radius:9px;
  background:#190b10;
  color:#ffbec7;
  padding:0 11px;
}

.intelMapArea{
  position:relative;
  flex:1;
  min-height:0;
}

#intelMap{
  position:absolute;
  inset:0;
}

.targetBadge{
  position:absolute;
  top:9px;
  left:9px;
  z-index:1200;
  max-width:65%;
  background:rgba(2,8,13,.92);
  border:1px solid #20586e;
  border-radius:9px;
  padding:8px 10px;
  font-size:10px;
  direction:ltr;
}

.targetBadge b{
  color:#50ddff;
}

.intelScroll{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:1100;
  max-height:61%;
  overflow:auto;
  padding:28px 8px 9px;
  background:linear-gradient(
    transparent,
    rgba(2,6,10,.98) 18%
  );
}

.statsGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  background:rgba(5,15,23,.95);
  border:1px solid #17495d;
  border-radius:10px;
  padding:8px 4px;
  text-align:center;
}

.statLabel{
  font-size:8px;
  color:#7fa8b6;
  margin-bottom:5px;
}

.statValue{
  font-size:13px;
  font-weight:900;
  direction:ltr;
}

.analysisBox{
  margin-top:7px;
  padding:9px;
  background:rgba(4,12,18,.96);
  border:1px solid #164354;
  border-radius:10px;
}

.analysisTop{
  display:flex;
  justify-content:space-between;
  color:#9dc4d0;
  font-size:10px;
  margin-bottom:7px;
}

.progress{
  height:5px;
  background:#07131a;
  border-radius:99px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:#32d7ff;
  transition:width .35s;
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:7px;
}

.actionBtn{
  min-height:43px;
  border:1px solid #17485c;
  border-radius:9px;
  background:#07141d;
  color:#d8f7ff;
  font-size:10px;
  font-weight:bold;
}

.actionBtn:active{
  transform:scale(.97);
}

.timeline{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-top:7px;
}

.timeline::-webkit-scrollbar{
  display:none;
}

.yearBtn{
  flex:1;
  min-width:68px;
  border:1px solid #17485b;
  border-radius:8px;
  background:#08141d;
  color:#91b6c2;
  padding:8px 5px;
  font-size:10px;
}

.yearBtn.active{
  background:#07566d;
  border-color:#32d8ff;
  color:white;
}

.resultBox{
  margin-top:7px;
  padding:10px;
  background:rgba(4,12,18,.96);
  border:1px solid #17485b;
  border-radius:10px;
  color:#b9d8e1;
  font-size:11px;
  line-height:1.7;
}

.resultBox strong{
  color:#4bdcff;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:absolute;
  left:50%;
  bottom:155px;
  transform:translateX(-50%);
  z-index:7000;
  display:none;
  max-width:88%;
  background:rgba(3,12,18,.96);
  border:1px solid #2bbedd;
  color:#e8fbff;
  border-radius:10px;
  padding:9px 13px;
  font-size:11px;
  text-align:center;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .logo{
    font-size:15px;
  }

  .topbar{
    height:58px;
    min-height:58px;
  }

  .searchBox input{
    font-size:12px;
  }

  .searchBtn{
    padding:0 8px;
  }

  .btn{
    padding:0 8px;
  }

  .statsGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .actionGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .intelScroll{
    max-height:64%;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     MAP SCREEN
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   TERRA X 5.0 ENGINE
===================================================== */


/* =====================================================
   BASE MAPS
===================================================== */

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles &copy; Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:13,
    attribution:"Tiles &copy; Esri"
  }
);


/* =====================================================
   MAPS
===================================================== */

const map = L.map(
  "map",
  {
    center:[31.95,35.91],
    zoom:7,
    layers:[street]
  }
);

const intelMap = L.map(
  "intelMap",
  {
    center:[31.95,35.91],
    zoom:7,
    zoomControl:false,
    layers:[satellite]
  }
);


/* =====================================================
   STATE
===================================================== */

let currentTarget = {
  name:"GLOBAL VIEW",
  lat:31.95,
  lon:35.91
};

let currentLayer = "street";

let userLocation = null;
let userMarker = null;
let accuracyCircle = null;

let targetMarker = null;

let searchMarkers = [];

let drawing = false;
let measuring = false;

let points = [];
let pointMarkers = [];

let polygon = null;
let measureLine = null;

let lastSearchTime = 0;


/* =====================================================
   LAYER SWITCH
===================================================== */

function setLayer(type){

  map.removeLayer(street);
  map.removeLayer(satellite);
  map.removeLayer(terrain);

  document
    .querySelectorAll(".layerBtn")
    .forEach(
      b => b.classList.remove("active")
    );

  if(type === "street"){

    street.addTo(map);

    document
      .getElementById("streetBtn")
      .classList.add("active");
  }

  if(type === "satellite"){

    satellite.addTo(map);

    document
      .getElementById("satelliteBtn")
      .classList.add("active");
  }

  if(type === "terrain"){

    terrain.addTo(map);

    document
      .getElementById("terrainBtn")
      .classList.add("active");
  }

  currentLayer = type;
}


/* =====================================================
   INTELLIGENCE OPEN
===================================================== */

function openIntelligence(){

  document
    .getElementById("intelScreen")
    .style.display = "block";

  setTimeout(() => {

    intelMap.invalidateSize();

    intelMap.setView(
      map.getCenter(),
      map.getZoom()
    );

  },200);
}


/* =====================================================
   INTELLIGENCE CLOSE
===================================================== */

function closeIntelligence(){

  document
    .getElementById("intelScreen")
    .style.display = "none";
}


/* =====================================================
   SMART SEARCH
===================================================== */

async function smartSearch(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input.value.trim();

  if(!query){

    showToast(
      "اكتب اسم مكان أولاً."
    );

    return;
  }

  const now = Date.now();

  if(now-lastSearchTime < 1100){

    showToast(
      "انتظر لحظة قبل إجراء بحث آخر."
    );

    return;
  }

  lastSearchTime = now;

  closeResults();

  setAnalysis(
    "SEARCHING GLOBAL DATABASE",
    20
  );

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&namedetails=1" +
      "&limit=8" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(url);

    if(!response.ok){

      throw new Error(
        "Nominatim request failed"
      );
    }

    const data =
      await response.json();

    if(!data.length){

      setAnalysis(
        "NO RESULTS",
        0
      );

      showToast(
        "لم يتم العثور على نتائج."
      );

      return;
    }

    setAnalysis(
      "RESULTS ACQUIRED",
      100
    );

    showResults(data);

  }catch(error){

    console.error(error);

    setAnalysis(
      "SEARCH ERROR",
      0
    );

    showToast(
      "حدث خطأ أثناء البحث."
    );
  }
}


/* =====================================================
   SHOW SEARCH RESULTS
===================================================== */

function showResults(data){

  const panel =
    document.getElementById(
      "resultsPanel"
    );

  panel.innerHTML = "";

  data.forEach(
    (place,index) => {

      const item =
        document.createElement("div");

      item.className =
        "resultItem";

      item.innerHTML = `
        <div class="resultName">
          ${escapeHtml(place.display_name)}
        </div>

        <div class="resultMeta">
          ${escapeHtml(
            place.type || "place"
          )}
          ·
          ${parseFloat(place.lat).toFixed(5)},
          ${parseFloat(place.lon).toFixed(5)}
        </div>

        <button
          class="resultOpen"
          onclick="openSearchResult(${index})"
        >
          فتح على الخريطة
        </button>
      `;

      panel.appendChild(item);

    }
  );

  window.latestSearchResults = data;

  panel.style.display = "block";
}


/* =====================================================
   OPEN SEARCH RESULT
===================================================== */

function openSearchResult(index){

  const data =
    window.latestSearchResults;

  if(!data || !data[index])
    return;

  const place =
    data[index];

  const lat =
    parseFloat(place.lat);

  const lon =
    parseFloat(place.lon);

  currentTarget = {
    name:place.display_name,
    lat:lat,
    lon:lon
  };

  map.setView(
    [lat,lon],
    15
  );

  setTarget(
    place.display_name,
    lat,
    lon
  );

  closeResults();

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>TARGET ACQUIRED</strong><br>" +
    escapeHtml(place.display_name) +
    "<br><br>" +
    "LAT: " +
    lat.toFixed(6) +
    "<br>" +
    "LON: " +
    lon.toFixed(6);

  openIntelligence();
}


/* =====================================================
   SET TARGET
===================================================== */

function setTarget(
  name,
  lat,
  lon
){

  currentTarget = {
    name:name,
    lat:lat,
    lon:lon
  };

  document.getElementById(
    "targetName"
  ).innerText =
    shortenName(name);

  intelMap.setView(
    [lat,lon],
    15
  );

  if(targetMarker){

    intelMap.removeLayer(
      targetMarker
    );
  }

  targetMarker =
    L.marker([lat,lon])
    .addTo(intelMap)
    .bindPopup(
      "<b>TERRA X TARGET</b><br>" +
      escapeHtml(name)
    );
}


/* =====================================================
   CATEGORY SEARCH
===================================================== */

async function categorySearch(type){

  let query = "";

  const targetText =
    currentTarget.name !== "GLOBAL VIEW"

/* =====================================================
   GPS
===================================================== */

function getLocation(){

  if(!navigator.geolocation){

    showToast(
      "المتصفح لا يدعم GPS."
    );

    return;
  }

  setAnalysis(
    "ACQUIRING GPS",
    15
  );

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      userLocation = [
        lat,
        lon
      ];

      if(userMarker)
        map.removeLayer(userMarker);

      if(accuracyCircle)
        map.removeLayer(accuracyCircle);

      userMarker =
        L.marker(
          userLocation
        )
        .addTo(map)
        .bindPopup(
          "📍 موقعك الحالي"
        );

      accuracyCircle =
        L.circle(
          userLocation,
          {
            radius:accuracy
          }
        ).addTo(map);

      map.setView(
        userLocation,
        16
      );

      setTarget(
        "MY LOCATION",
        lat,
        lon
      );

      setAnalysis(
        "GPS LOCK ACQUIRED",
        100
      );

      document.getElementById(
        "resultBox"
      ).innerHTML =
        "<strong>GPS LOCATION</strong><br>" +
        "Latitude: " +
        lat.toFixed(6) +
        "<br>" +
        "Longitude: " +
        lon.toFixed(6) +
        "<br>" +
        "Accuracy: ±" +
        Math.round(accuracy) +
        " m";

      openIntelligence();

    },

    error => {

      console.error(error);

      setAnalysis(
        "GPS FAILED",
        0
      );

      showToast(
        "تعذر تحديد الموقع. تأكد من إعطاء الموقع إذنًا."
      );
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

/* =====================================================
   BUILDING ANALYSIS
===================================================== */

async function buildingAnalysis(){

  const lat =
    currentTarget.lat;

  const lon =
    currentTarget.lon;

  setAnalysis(
    "SCANNING BUILDINGS",
    15
  );

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>BUILDING ANALYSIS</strong><br>" +
    "جارٍ تحليل المباني المسجلة حول الهدف...";

  const query = `
    [out:json][timeout:25];
    (
      way["building"](around:2000,${lat},${lon});
      relation["building"](around:2000,${lat},${lon});
    );
    out center tags;
  `;

  const servers = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
  ];

  let data = null;

  for(
    const server of servers
  ){

    try{

      const response =
        await fetch(
          server +
          "?data=" +
          encodeURIComponent(query)
        );

      if(response.ok){

        data =
          await response.json();

        break;
      }

    }catch(error){

      console.log(
        "Overpass failed",
        server
      );
    }
  }

  if(!data){

    setAnalysis(
      "BUILDING SCAN FAILED",
      0
    );

    showToast(
      "تعذر الوصول إلى بيانات المباني."
    );

    return;
  }

  const count =
    data.elements.length;

  document.getElementById(
    "buildingValue"
  ).innerText =
    count.toLocaleString();

  setAnalysis(
    "BUILDING SCAN COMPLETE",
    100
  );

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>BUILDING ANALYSIS</strong><br>" +
    "المباني المسجلة ضمن نطاق تقريبي 2 كم:<br><br>" +
    "<strong>" +
    count.toLocaleString() +
    "</strong> مبنى<br><br>" +
    "المصدر: OpenStreetMap / Overpass.";

}

/* =====================================================
   DRAW AREA
===================================================== */

function startDrawing(){

  openIntelligence();

  resetTools();

  drawing = true;

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>DRAW AREA</strong><br>" +
    "اضغط على الخريطة لإضافة النقاط.<br>" +
    "أضف 3 نقاط على الأقل لإغلاق المنطقة.";

  setAnalysis(
    "DRAW MODE ACTIVE",
    20
  );

  intelMap.once(
    "click",
    addDrawPoint
  );
}


function addDrawPoint(e){

  if(!drawing)
    return;

  points.push([
    e.latlng.lat,
    e.latlng.lng
  ]);

  const marker =
    L.circleMarker(
      e.latlng,
      {
        radius:6
      }
    ).addTo(intelMap);

  pointMarkers.push(marker);

  if(points.length >= 3){

    if(polygon)
      intelMap.removeLayer(polygon);

    polygon =
      L.polygon(
        points,
        {
          color:"#31d8ff",
          fillOpacity:.16
        }
      ).addTo(intelMap);

    drawing = false;

    calculateArea();

    setAnalysis(
      "AREA COMPLETE",
      100
    );

  }else{

    setAnalysis(
      "POINT " +
      points.length +
      " / 3",
      points.length * 25
    );

    intelMap.once(
      "click",
      addDrawPoint
    );
  }
}


/* =====================================================
   AREA
===================================================== */

function calculateArea(){

  if(!polygon)
    return;

  const latlngs =
    polygon.getLatLngs()[0];

  let area = 0;

  for(
    let i=0;
    i<latlngs.length;
    i++
  ){

    const p1 =
      latlngs[i];

    const p2 =
      latlngs[
        (i+1) %
        latlngs.length
      ];

    area +=
      (p2.lng-p1.lng) *
      (p1.lat+p2.lat);
  }

  area =
    Math.abs(area) *
    12364 /
    2;

  const value =
    area.toFixed(2);

  document.getElementById(
    "areaValue"
  ).innerText =
    value + " km²";

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>AREA ANALYSIS</strong><br>" +
    "Estimated area:<br><br>" +
    "<strong>" +
    value +
    " km²" +
    "</strong><br><br>" +
    "المساحة تقريبية حسب المضلع المرسوم.";
}


/* =====================================================
   DISTANCE MEASURE
===================================================== */

function measureDistance(){

  openIntelligence();

  resetTools();

  measuring = true;

  document.getElementById(
    "resultBox"
  ).innerHTML =
    "<strong>DISTANCE TOOL</strong><br>" +
    "اضغط نقطتين على الخريطة لحساب المسافة.";

    20

}


function addMeasurePoint(e){

  if(!measuring)
    return;

  points.push([
    e.latlng.lat,
    e.latlng.lng
  ]);

  const marker =
    L.circleMarker(
      e.latlng,
      {
        radius:6
      }
    ).addTo(intelMap);

  pointMarkers.push(marker);

  if(points.length === 2){

    measureLine =
      L.polyline(
        points,
        {
          color:"#31d8ff"
        }
      ).addTo(intelMap);

    const p1 =
      L.latLng(
        points[0][0],
        points[0][1]
      );

    const p2 =
      L.latLng(
        points[1][0],
        points[1][1]
      );

    const meters =
      p1.distanceTo(p2);

    const display =
      meters >= 1000
        ? (meters/1000).toFixed(2) +
          " km"
        : Math.round(meters) +
          " m";

    document.getElementById(
      "resultBox"
    ).innerHTML =
      "<strong>DISTANCE</strong><br>" +
      "Distance: <strong>" +
      display +
      "</strong>";

    setAnalysis(
      "DISTANCE COMPLETE",
      100
    );

    measuring = false;

  }else{

    setAnalysis(
      "POINT 1 / 2",
      50
    );

    intelMap.once(
      "click",
      addMeasurePoint
    );
  }
}


/* =====================================================
   RESET DRAW TOOLS
===================================================== */

function resetTools(){

  drawing = false;
  measuring = false;

  points = [];

  pointMarkers.forEach(
    marker =>
    intelMap.removeLayer(marker)
  );

  pointMarkers = [];

  if(polygon){

    intelMap.removeLayer(
      polygon
    );

    polygon = null;
  }

  if(measureLine){

    intelMap.removeLayer(
      measureLine
    );

    measureLine = null;
  }
}

/* =====================================================
   AI COMMANDS
===================================================== */

function runAICommand(text){

  const command =
    text.toLowerCase().trim();

  if(
    command.includes("مباني") ||
    command.includes("buildings")
  ){

    buildingAnalysis();
    return;
  }

  if(
    command.includes("مساحة") ||
    command.includes("area")
  ){

    if(polygon)
      calculateArea();
    else
      startDrawing();

    return;
  }

  if(
    command.includes("سكان") ||
    command.includes("population")
  ){

    populationAnalysis();
    return;
  }

  if(
    command.includes("نبات") ||
    command.includes("vegetation")
  ){

    vegetationAnalysis();
    return;
  }

  smartSearch();
}

/* =====================================================
   HELPERS
===================================================== */

function shortenName(name){

  if(!name)
    return "UNKNOWN";

  const parts =
    name.split(",");

  if(parts.length <= 2)
    return name;

  return parts
    .slice(0,2)
    .join(",");
}


function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;
}
