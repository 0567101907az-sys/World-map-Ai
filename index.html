<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>TERRA X</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05070b;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ================= HEADER ================= */

    .topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 12px;

      background: rgba(7, 10, 16, 0.90);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;

      backdrop-filter: blur(15px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .logo {
      min-width: 92px;
      text-align: center;
    }

    .logo-main {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo-sub {
      font-size: 8px;
      color: #8e99aa;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .searchBox {
      flex: 1;
      display: flex;
      gap: 6px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;

      border: 1px solid rgba(255,255,255,0.10);
      outline: none;

      background: rgba(255,255,255,0.07);
      color: white;

      border-radius: 12px;
      padding: 12px;

      font-size: 14px;
    }

    #searchInput::placeholder {
      color: #8992a2;
    }

    .searchBtn {
      width: 45px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #05070b;
      font-size: 18px;
      font-weight: bold;
    }

    /* ================= BOTTOM PANEL ================= */

    .bottomPanel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 1000;

      background: rgba(7, 10, 16, 0.93);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;

      padding: 12px;

      backdrop-filter: blur(18px);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
    }

    .handle {
      width: 42px;
      height: 4px;
      border-radius: 10px;
      background: #596273;
      margin: 0 auto 12px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tool {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.055);
      color: white;

      border-radius: 15px;
      padding: 11px 4px;

      font-size: 11px;
      text-align: center;
    }

    .tool span {
      display: block;
      font-size: 21px;
      margin-bottom: 5px;
    }

    .tool:active {
      transform: scale(0.96);
    }

    /* ================= LOCATION BUTTON ================= */

    .locationBtn {
      position: fixed;
      right: 20px;
      bottom: 205px;

      z-index: 999;

      width: 50px;
      height: 50px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;

      background: rgba(7,10,16,0.92);
      color: white;

      font-size: 21px;

      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    /* ================= SIDE CARD ================= */

    .infoCard {
      position: fixed;
      top: 92px;
      left: 12px;
      right: 12px;

      z-index: 900;

      display: none;

      background: rgba(7,10,16,0.94);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;

      padding: 15px;

      backdrop-filter: blur(18px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .infoTitle {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .infoText {
      color: #aab3c2;
      font-size: 12px;
      line-height: 1.7;
    }

    .closeBtn {
      float: left;
      border: 0;
      background: transparent;
      color: #8992a2;
      font-size: 18px;
    }

    /* ================= RESULTS ================= */

    #results {
      max-height: 170px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .result {
      padding: 9px;
      margin-bottom: 6px;

      border-radius: 12px;
      background: rgba(255,255,255,0.05);

      font-size: 12px;
    }

    .result small {
      display: block;
      color: #8992a2;
      margin-top: 4px;
    }

    /* ================= STATUS ================= */

    .status {
      text-align: center;
      color: #7f8999;
      font-size: 10px;
      margin-top: 8px;
    }

    /* ================= LEAFLET ================= */

    .leaflet-control-layers {
      background: rgba(7,10,16,0.92) !important;
      color: white !important;
      border: 1px solid rgba(255,255,255,0.10) !important;
      border-radius: 12px !important;
    }

    .leaflet-control-layers label {
      color: white;
    }

    .leaflet-control-zoom {
      display: none;
    }

    @media (max-width: 430px) {
      .logo {
        min-width: 80px;
      }

      .logo-main {
        font-size: 17px;
      }

      .tool {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- HEADER -->
  <div class="topbar">

    <div class="logo">
      <div class="logo-main">TERRA X</div>
      <div class="logo-sub">SEE THE WORLD DIFFERENTLY</div>
    </div>

    <div class="searchBox">

      <input
        id="searchInput"
        type="text"
        placeholder="ابحث عن مدينة، مكان، مستشفى..."
      >

      <button class="searchBtn" onclick="smartSearch()">⌕</button>

    </div>

  </div>

  <!-- INFO CARD -->
  <div class="infoCard" id="infoCard">

    <button class="closeBtn" onclick="closeInfo()">✕</button>

    <div class="infoTitle" id="infoTitle">
      TERRA X
    </div>

    <div class="infoText" id="infoText">
      جاهز لتحليل العالم.
    </div>

    <div id="results"></div>

    <div class="status" id="status"></div>

  </div>

  <!-- LOCATION -->
  <button
    class="locationBtn"
    onclick="getMyLocation()"
    title="موقعي"
  >
    📍
  </button>

  <!-- BOTTOM PANEL -->
  <div class="bottomPanel">

    <div class="handle"></div>

    <div class="tools">

      <button class="tool" onclick="populationAI()">
        <span>👥</span>
        Population AI
      </button>

      <button class="tool" onclick="satelliteCompare()">
        <span>🛰️</span>
        Satellite
      </button>

      <button class="tool" onclick="analysisMode()">
        <span>📊</span>
        Analysis
      </button>

      <button class="tool" onclick="drawMode()">
        <span>✏️</span>
        تحديد منطقة
      </button>

    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    /* =====================================================
       MAP LAYERS
    ===================================================== */

    const street = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    );

    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    );

    const terrain = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 13,
        attribution: "Tiles &copy; Esri"
      }
    );

    const map = L.map("map", {
      center: [31.95, 35.91],
      zoom: 7,
      layers: [street]
    });

    const mapTypes = {
      "🗺️ الشوارع": street,
      "🛰️ القمر الصناعي": satellite,
      "⛰️ التضاريس": terrain
    };

    L.control.layers(mapTypes, null, {
      position: "topright"
    }).addTo(map);


    /* =====================================================
       VARIABLES
    ===================================================== */

    let markers = [];
    let userLocation = null;
    let userMarker = null;
    let accuracyCircle = null;
    let selectedArea = null;


    /* =====================================================
       UI
    ===================================================== */

    function showInfo(title, text) {

      document.getElementById("infoCard").style.display = "block";

      document.getElementById("infoTitle").innerText = title;

      document.getElementById("infoText").innerText = text;

    }


    function closeInfo() {

      document.getElementById("infoCard").style.display = "none";

    }


    function clearMarkers() {

      markers.forEach(marker => map.removeLayer(marker));

      markers = [];

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    async function smartSearch() {

      const input =
        document.getElementById("searchInput").value.trim();

      if (!input) return;

      showInfo(
        "🔎 TERRA X SEARCH",
        "جاري تحليل طلبك..."
      );

      document.getElementById("results").innerHTML = "";

      clearMarkers();

      try {

        const geoURL =
          "https://nominatim.openstreetmap.org/search" +
          "?format=jsonv2&limit=1&q=" +
          encodeURIComponent(input);

        const response =
          await fetch(geoURL);

        const data =
          await response.json();

        if (!data.length) {

          showInfo(
            "❌ لم نجد النتيجة",
            "جرّب اسمًا آخر أو اكتب المدينة مع المكان."
          );

          return;

        }

        const place = data[0];

        const lat =
          parseFloat(place.lat);

        const lon =
          parseFloat(place.lon);

        map.setView(
          [lat, lon],
          13
        );

        const marker =
          L.marker([lat, lon])
          .addTo(map);

        marker.bindPopup(
          `<b>${place.display_name}</b>`
        ).openPopup();

        markers.push(marker);

        showInfo(
          "📍 الموقع",
          place.display_name
        );

      } catch (error) {

        showInfo(
          "⚠️ خطأ",
          "تعذر الاتصال بخدمة البحث."
        );

      }

    }


    /* =====================================================
       MY LOCATION
    ===================================================== */

    function getMyLocation() {

      if (!navigator.geolocation) {

        showInfo(
          "❌ غير متاح",
          "جهازك لا يدعم تحديد الموقع."
        );

        return;

      }

      showInfo(
        "📍 موقعي الآن",
        "جاري تحديد موقعك..."
      );

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          userLocation =
            [lat, lon];

          if (userMarker)
            map.removeLayer(userMarker);

          if (accuracyCircle)
            map.removeLayer(accuracyCircle);

          userMarker =
            L.marker(userLocation)
            .addTo(map)
            .bindPopup("📍 موقعك الحالي")
            .openPopup();

          accuracyCircle =
            L.circle(
              userLocation,
              {
                radius: accuracy
              }
            ).addTo(map);

          map.setView(
            userLocation,
            15
          );

          showInfo(
            "📍 موقعك",
            "تم تحديد موقعك بنجاح."
          );

        },

        error => {

          showInfo(
            "⚠️ تعذر تحديد الموقع",
            "تأكد من السماح للتطبيق باستخدام الموقع."
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /* =====================================================
       POPULATION AI
    ===================================================== */

    function populationAI() {

      showInfo(
        "👥 POPULATION AI",
        "حدد منطقة على الخريطة لتحليل السكان."
      );

      document.getElementById("results").innerHTML = `

        <div class="result">
          👥 تقدير السكان
          <small>
            سيتم حسابه من بيانات سكانية حقيقية
            عند ربط مصدر البيانات.
          </small>
        </div>

        <div class="result">
          🏠 المباني
          <small>
            تحليل الكثافة العمرانية
          </small>
        </div>

        <div class="result">
          📊 الكثافة
          <small>
            عدد السكان بالنسبة للمساحة
          </small>
        </div>

      `;

    }


    /* =====================================================
       SATELLITE COMPARE
    ===================================================== */

    function satelliteCompare() {

      showInfo(
        "🛰️ SATELLITE COMPARE",
        "ميزة مقارنة صور الأقمار الصناعية قيد البناء."
      );

      document.getElementById("results").innerHTML = `

        <div class="result">
          🔄 مقارنة زمنية
          <small>
            قبل ← بعد
          </small>
        </div>

        <div class="result">
          📅 السنوات
          <small>
            سيتم عرض السنوات المتاحة للموقع.
          </small>
        </div>

        <div class="result">
          🔍 تحليل التغير
          <small>
            عمران • نباتات • تغيرات سطحية
          </small>
        </div>

      `;

    }


    /* =====================================================
       ANALYSIS
    ===================================================== */

    function analysisMode() {

      showInfo(
        "📊 TERRA X ANALYSIS",
        "اختر منطقة لبدء التحليل الجغرافي."
      );

      document.getElementById("results").innerHTML = `

        <div class="result">
          🏙️ العمران
          <small>
            تحليل المناطق المبنية
          </small>
        </div>

        <div class="result">
          🌳 الغطاء النباتي
          <small>
            تحليل المساحات الخضراء
          </small>
        </div>

        <div class="result">
          🛣️ الطرق
          <small>
            تحليل شبكة الطرق
          </small>
        </div>

        <div class="result">
          🏠 المباني
          <small>
            تحليل المباني والمناطق السكنية
          </small>
        </div>

      `;

    }


    /* =====================================================
       AREA SELECTION
    ===================================================== */

    function drawMode() {

      showInfo(
        "✏️ تحديد منطقة",
        "اضغط على نقطتين أو أكثر على الخريطة لإنشاء منطقة."
      );

      alert(
        "ميزة الرسم المتقدم سنضيفها في الخطوة التالية 🔥"
      );

    }


    /* =====================================================
       ENTER KEY
    ===================================================== */

    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            smartSearch();

          }

        }
      );

  </script>

</body>
</html>
