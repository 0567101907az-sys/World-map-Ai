<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TERRA X 7.1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#05070b;
  color:#fff
}
button,input{font:inherit}
button{cursor:pointer}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden
}

.screen{
  position:absolute;
  inset:0;
  display:none
}
.screen.active{display:block}

#mapScreen{background:#05070b}

#map{
  position:absolute;
  inset:0
}

.leaflet-control-attribution{
  font-size:9px!important
}

.topbar{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
  align-items:center;
  direction:ltr
}

.logo{
  min-width:100px;
  padding:11px 13px;
  border-radius:14px;
  background:rgba(4,8,14,.9);
  border:1px solid rgba(0,220,255,.35);
  box-shadow:0 0 20px rgba(0,200,255,.12);
  font-weight:900;
  letter-spacing:2px;
  color:#7deaff
}

.searchBox{
  flex:1;
  display:flex;
  gap:6px
}

.searchBox input{
  min-width:0;
  flex:1;
  border:1px solid rgba(255,255,255,.14);
  outline:none;
  border-radius:13px;
  background:rgba(5,10,17,.92);
  color:#fff;
  padding:11px 13px
}

.btn{
  border:1px solid rgba(0,220,255,.25);
  color:#dffaff;
  background:rgba(6,14,23,.92);
  border-radius:12px;
  padding:10px 12px;
  transition:.2s
}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:linear-gradient(135deg,#006b83,#004252);
  border-color:#16d8ff
}
.btn.danger{
  border-color:rgba(255,70,70,.4)
}

.mapControls{
  position:absolute;
  z-index:1000;
  top:67px;
  left:10px;
  display:flex;
  gap:6px;
  direction:ltr;
  flex-wrap:wrap
}

.bottomPanel{
  position:absolute;
  z-index:1000;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(4,8,14,.94);
  border:1px solid rgba(0,220,255,.2);
  border-radius:18px;
  padding:10px;
  max-height:38vh;
  overflow:auto;
  backdrop-filter:blur(10px)
}

.panelTitle{
  color:#71e8ff;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.chip{
  padding:8px 10px;
  border-radius:10px;
  background:#0b141e;
  border:1px solid #203442;
  color:#d8f9ff;
  font-size:12px
}

.result{
  padding:9px;
  border-bottom:1px solid rgba(255,255,255,.07);
  cursor:pointer
}
.result:last-child{border-bottom:0}
.result strong{display:block}
.result small{color:#9bb0bc}

#intelScreen{
  background:#03060a
}

#intelMap{
  position:absolute;
  inset:0
}

.intelOverlay{
  position:absolute;
  inset:0;
  z-index:1100;
  pointer-events:none
}

.intelHeader{
  pointer-events:auto;
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  padding:10px;
  border:1px solid rgba(0,220,255,.28);
  background:rgba(3,8,14,.91);
  border-radius:16px;
  backdrop-filter:blur(12px)
}

.intelHeaderRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.intelTitle{
  color:#7deaff;
  font-weight:900;
  letter-spacing:1.5px
}

.targetBadge{
  color:#a7bac5;
  font-size:10px;
  margin-top:4px
}

.intelTools{
  pointer-events:auto;
  position:absolute;
  top:100px;
  left:10px;
  right:10px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:3px;
  direction:rtl
}

.toolBtn{
  white-space:nowrap;
  border:1px solid rgba(0,220,255,.28);
  background:rgba(4,11,18,.94);
  color:#dffaff;
  border-radius:12px;
  padding:9px 11px;
  font-size:12px
}
.toolBtn.active{
  background:#06485a;
  border-color:#17d9ff;
  box-shadow:0 0 14px rgba(0,220,255,.2)
}

.radiusMenu{
  pointer-events:auto;
  position:absolute;
  top:150px;
  right:10px;
  display:none;
  flex-direction:column;
  gap:5px;
  padding:7px;
  border:1px solid rgba(0,220,255,.3);
  background:rgba(3,9,15,.96);
  border-radius:13px
}
.radiusMenu.show{display:flex}
.radiusMenu button{
  border:1px solid #213946;
  background:#09131b;
  color:white;
  border-radius:9px;
  padding:7px 12px
}

.intelStats{
  pointer-events:auto;
  position:absolute;
  bottom:120px;
  left:10px;
  right:10px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px
}

.stat{
  padding:11px;
  border-radius:14px;
  border:1px solid rgba(0,220,255,.18);
  background:rgba(3,9,15,.91);
  backdrop-filter:blur(10px)
}

.statLabel{
  font-size:10px;
  color:#8da3ae
}
.statValue{
  margin-top:5px;
  font-size:18px;
  font-weight:900;
  color:#e8fbff
}

.intelBottom{
  pointer-events:auto;
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  max-height:100px;
  overflow:auto;
  padding:10px;
  border-radius:15px;
  border:1px solid rgba(0,220,255,.2);
  background:rgba(3,8,14,.94);
  font-size:11px;
  color:#c8d8df
}

.selectionHint{
  pointer-events:none;
  position:absolute;
  z-index:1200;
  top:200px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 13px;
  border-radius:12px;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(0,220,255,.35);
  color:#bfefff;
  font-size:11px;
  display:none
}
.selectionHint.show{display:block}

#toast{
  position:absolute;
  z-index:5000;
  left:50%;
  bottom:18px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#07121a;
  border:1px solid #13cfee;
  border-radius:13px;
  padding:10px 14px;
  font-size:12px;
  transition:.25s;
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;
  text-overflow:ellipsis
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

.loading{
  color:#7deaff;
  padding:10px 0
}

.reportBox{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:11px;
  color:#d5e7ed
}

@media(min-width:700px){
  .intelStats{
    grid-template-columns:repeat(4,1fr)
  }
  .bottomPanel{
    max-width:500px
  }
}
</style>
</head>

<body>
<div id="app">

  <!-- ================= MAIN MAP ================= -->
  <section id="mapScreen" class="screen active">

    <div id="map"></div>

    <div class="topbar">
      <div class="logo">TERRA X</div>

      <div class="searchBox">
        <input id="searchInput" placeholder="ابحث عن مدينة، مكان، دولة..." />
        <button class="btn primary" onclick="searchPlace()">بحث</button>
      </div>
    </div>

    <div class="mapControls">
      <button class="btn" onclick="setBase('street')">🗺️ Street</button>
      <button class="btn" onclick="setBase('satellite')">🛰️ Satellite</button>
      <button class="btn" onclick="setBase('terrain')">⛰️ Terrain</button>
      <button class="btn" onclick="locateUser()">📍 GPS</button>
      <button class="btn primary" onclick="openIntel()">🧠 INTELLIGENCE</button>
    </div>

    <div class="bottomPanel">
      <div class="panelTitle">QUICK SEARCH</div>

      <div class="chips">
        <button class="chip" onclick="quickSearch('مستشفيات')">🏥 مستشفيات</button>
        <button class="chip" onclick="quickSearch('مدارس')">🏫 مدارس</button>
        <button class="chip" onclick="quickSearch('جامعات')">🎓 جامعات</button>
        <button class="chip" onclick="quickSearch('صيدليات')">💊 صيدليات</button>
        <button class="chip" onclick="quickSearch('مطاعم')">🍽️ مطاعم</button>
        <button class="chip" onclick="quickSearch('فنادق')">🏨 فنادق</button>
        <button class="chip" onclick="quickSearch('مساجد')">🕌 مساجد</button>
      </div>

      <div id="results"></div>
    </div>
  </section>

  <!-- ================= INTELLIGENCE ================= -->
  <section id="intelScreen" class="screen">

    <div id="intelMap"></div>

    <div class="intelOverlay">

      <div class="intelHeader">
        <div class="intelHeaderRow">
          <div>
            <div class="intelTitle">TERRA X // INTELLIGENCE</div>
            <div class="targetBadge" id="targetBadge">
              TARGET: لا يوجد هدف
            </div>
          </div>

          <button class="btn danger" onclick="closeIntel()">← الخريطة</button>
        </div>
      </div>

      <!-- SMART TARGET TOOLBAR -->
      <div class="intelTools">

        <button id="pointTool"
                class="toolBtn"
                onclick="startPointMode()">
          📍 نقطة
        </button>

        <button id="areaTool"
                class="toolBtn"
                onclick="startAreaMode()">
          🔷 منطقة
        </button>

        <button id="radiusTool"
                class="toolBtn"
                onclick="toggleRadiusMenu()">
          ⭕ نصف قطر
        </button>

        <button class="toolBtn" onclick="undoAreaPoint()">
          ↶ تراجع
        </button>

        <button class="toolBtn" onclick="finishArea()">
          ✓ إنهاء
        </button>

        <button class="toolBtn" onclick="cancelSelection()">
          ✕ إلغاء
        </button>

        <button class="toolBtn" onclick="analyzeTarget()">
          🧠 تحليل
        </button>

        <button class="toolBtn" onclick="saveSnapshot()">
          💾 Snapshot
        </button>

      </div>

      <div id="radiusMenu" class="radiusMenu">
        <button onclick="startRadiusMode(500)">500 m</button>
        <button onclick="startRadiusMode(1000)">1 km</button>
        <button onclick="startRadiusMode(2000)">2 km</button>
        <button onclick="startRadiusMode(5000)">5 km</button>
      </div>

      <div id="selectionHint" class="selectionHint"></div>

      <div class="intelStats">

        <div class="stat">
          <div class="statLabel">TARGET TYPE</div>
          <div class="statValue" id="statType">—</div>
        </div>

        <div class="stat">
          <div class="statLabel">AREA</div>
          <div class="statValue" id="statArea">—</div>
        </div>

        <div class="stat">
          <div class="statLabel">BUILDINGS</div>
          <div class="statValue" id="statBuildings">—</div>
        </div>

        <div class="stat">
          <div class="statLabel">EVENTS</div>
          <div class="statValue" id="statEvents">—</div>
        </div>

      </div>

      <div class="intelBottom" id="intelLog">
        TERRA X جاهز. اختر نقطة أو ارسم منطقة.
      </div>

    </div>
  </section>

  <div id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   TERRA X 7.1
   SMART TARGET ENGINE
   ========================================================= */

let map;
let intelMap;

let currentBase = null;

let target = null;
let targetMarker = null;

let intelTargetMarker = null;

let targetMode = null;
let radiusMeters = null;

let areaPoints = [];
let areaLayer = null;
let radiusLayer = null;

let buildingLayer = null;
let eventLayer = null;

let currentArea = null;
let currentRadius = null;

let userMarker = null;
let userCircle = null;

let searchMarkers = [];

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles &copy; Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:13,
    attribution:"Tiles &copy; Esri"
  }
);

/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

  map = L.map("map", {
    zoomControl:true
  }).setView([31.95,35.91],8);

  street.addTo(map);
  currentBase = street;

  intelMap = L.map("intelMap", {
    zoomControl:true
  }).setView([31.95,35.91],12);

  satellite.addTo(intelMap);

  map.on("click", e => {
    setPointTarget(e.latlng.lat,e.latlng.lng,true);
  });

  intelMap.on("click", handleIntelClick);

  showToast("TERRA X 7.1 جاهز 🚀");
});

/* =========================================================
   BASE MAP
   ========================================================= */

function setBase(type){

  if(currentBase){
    map.removeLayer(currentBase);
  }

  if(type==="street") currentBase=street;
  if(type==="satellite") currentBase=satellite;
  if(type==="terrain") currentBase=terrain;

  currentBase.addTo(map);
}

/* =========================================================
   SEARCH
   ========================================================= */

async function searchPlace(){

  const input=document.getElementById("searchInput");
  const q=input.value.trim();

  if(!q) return;

  const results=document.getElementById("results");
  results.innerHTML='<div class="loading">جاري البحث...</div>';

  try{

    const url=
      "https://nominatim.openstreetmap.org/search"+
      "?format=jsonv2"+
      "&addressdetails=1"+
      "&namedetails=1"+
      "&limit=8"+
      "&q="+encodeURIComponent(q);

    const response=await fetch(url,{
      headers:{
        "Accept":"application/json"
      }
    });

    const data=await response.json();

    results.innerHTML="";

    if(!data.length){
      results.innerHTML="لا توجد نتائج.";
      return;
    }

    data.forEach(item=>{

      const div=document.createElement("div");
      div.className="result";

      div.innerHTML=
        "<strong>"+escapeHtml(item.display_name)+"</strong>"+
        "<small>"+item.type+"</small>";

      div.onclick=()=>{

        const lat=parseFloat(item.lat);
        const lon=parseFloat(item.lon);

        map.setView([lat,lon],15);

        setPointTarget(lat,lon,true);

        results.innerHTML="";
      };

      results.appendChild(div);
    });

  }catch(err){

    results.innerHTML=
      "تعذر الاتصال بخدمة البحث.";

    console.error(err);
  }
}

function quickSearch(q){

  document.getElementById("searchInput").value=q;
  searchPlace();
}

/* =========================================================
   TARGET SYSTEM
   ========================================================= */

function setPointTarget(lat,lon,openIntelAfter=false){

  target={
    type:"point",
    lat:lat,
    lon:lon,
    createdAt:new Date().toISOString()
  };

  currentArea=null;
  currentRadius=null;

  clearSelectionLayers();

  if(targetMarker){
    map.removeLayer(targetMarker);
  }

  targetMarker=L.marker([lat,lon])
    .addTo(map)
    .bindPopup("🎯 TERRA X TARGET")
    .openPopup();

  updateTargetUI();

  reverseGeocode(lat,lon);

  if(openIntelAfter){
    openIntel();
  }
}

async function reverseGeocode(lat,lon){

  try{

    const url=
      "https://nominatim.openstreetmap.org/reverse"+
      "?format=jsonv2"+
      "&lat="+lat+
      "&lon="+lon+
      "&addressdetails=1";

    const r=await fetch(url);
    const d=await r.json();

    if(target){
      target.name=d.display_name || "Unknown";
      target.address=d.address || {};
    }

    updateTargetUI();

  }catch(e){
    console.log(e);
  }
}

/* =========================================================
   INTELLIGENCE SCREEN
   ========================================================= */

function openIntel(){

  document.getElementById("mapScreen")
    .classList.remove("active");

  document.getElementById("intelScreen")
    .classList.add("active");

  setTimeout(()=>{

    intelMap.invalidateSize();

    if(target){

      if(target.type==="point"){
        intelMap.setView(
          [target.lat,target.lon],
          Math.max(intelMap.getZoom(),14)
        );
      }

      updateIntelMarker();

    }

  },100);

  updateTargetUI();
}

function closeIntel(){

  document.getElementById("intelScreen")
    .classList.remove("active");

  document.getElementById("mapScreen")
    .classList.add("active");

  setTimeout(()=>{
    map.invalidateSize();
  },100);
}

/* =========================================================
   INTELLIGENCE MAP CLICK ENGINE
   ========================================================= */

function handleIntelClick(e){

  const lat=e.latlng.lat;
  const lon=e.latlng.lng;

  if(targetMode==="point"){

    setPointTarget(lat,lon,false);

    updateIntelMarker();

    intelMap.setView([lat,lon],15);

    showToast("تم تحديد النقطة 📍");

    targetMode=null;
    setToolActive(null);

    return;
  }

  if(targetMode==="area"){

    areaPoints.push([lat,lon]);

    redrawTemporaryArea();

    showHint(
      "النقاط: "+areaPoints.length+
      " — أضف نقاطاً ثم اضغط ✓ إنهاء"
    );

    return;
  }

  if(targetMode==="radius"){

    setRadiusTarget(lat,lon,radiusMeters);

    targetMode=null;

    setToolActive(null);

    hideHint();

    return;
  }

}

/* =========================================================
   POINT MODE
   ========================================================= */

function startPointMode(){

  cancelSelection();

  targetMode="point";

  setToolActive("pointTool");

  showHint("اضغط على الخريطة لتحديد نقطة 📍");
}

/* =========================================================
   AREA MODE
   ========================================================= */

function startAreaMode(){

  cancelSelection();

  targetMode="area";

  areaPoints=[];

  setToolActive("areaTool");

  showHint("اضغط عدة نقاط حول المنطقة ثم ✓ إنهاء");
}

function redrawTemporaryArea(){

  if(areaLayer){
    intelMap.removeLayer(areaLayer);
  }

  if(areaPoints.length===1){

    L.circleMarker(areaPoints[0],{
      radius:6,
      weight:2
    }).addTo(intelMap);

    return;
  }

  areaLayer=L.polygon(areaPoints,{
    weight:2,
    fillOpacity:.15
  }).addTo(intelMap);
}

function finishArea(){

  if(targetMode!=="area"){
    showToast("ابدأ أولاً بوضع 🔷 منطقة");
    return;
  }

  if(areaPoints.length<3){

    showToast("تحتاج المنطقة إلى 3 نقاط على الأقل");
    return;
  }

  if(areaLayer){
    intelMap.removeLayer(areaLayer);
  }

  areaLayer=L.polygon(areaPoints,{
    weight:3,
    fillOpacity:.18
  }).addTo(intelMap);

  const area=polygonArea(areaPoints);

  currentArea={
    coordinates:areaPoints.map(p=>[p[0],p[1]]),
    areaM2:area
  };

  const center=polygonCenter(areaPoints);

  target={
    type:"area",
    lat:center[0],
    lon:center[1],
    areaM2:area,
    polygon:areaPoints.map(p=>[p[0],p[1]]),
    createdAt:new Date().toISOString()
  };

  currentRadius=null;

  updateTargetUI();

  updateIntelMarker();

  targetMode=null;

  setToolActive(null);

  hideHint();

  updateStats();

  showToast(
    "تم تحديد المنطقة • "+
    formatArea(area)
  );
}

/* =========================================================
   RADIUS MODE
   ========================================================= */

function toggleRadiusMenu(){

  document.getElementById("radiusMenu")
    .classList.toggle("show");
}

function startRadiusMode(meters){

  document.getElementById("radiusMenu")
    .classList.remove("show");

  cancelSelection();

  radiusMeters=meters;

  targetMode="radius";

  setToolActive("radiusTool");

  showHint(
    "اضغط على الخريطة لوضع نصف قطر "+
    formatDistance(meters)
  );
}

function setRadiusTarget(lat,lon,meters){

  clearSelectionLayers();

  currentRadius={
    lat:lat,
    lon:lon,
    radius:meters
  };

  target={
    type:"radius",
    lat:lat,
    lon:lon,
    radius:meters,
    createdAt:new Date().toISOString()
  };

  radiusLayer=L.circle([lat,lon],{
    radius:meters,
    weight:3,
    fillOpacity:.12
  }).addTo(intelMap);

  updateTargetUI();
  updateIntelMarker();
  updateStats();

  intelMap.fitBounds(radiusLayer.getBounds(),{
    padding:[40,40]
  });

  showToast(
    "تم تحديد نطاق "+
    formatDistance(meters)
  );
}

/* =========================================================
   UNDO / CANCEL
   ========================================================= */

function undoAreaPoint(){

  if(targetMode!=="area"){

    showToast("التراجع يعمل أثناء رسم المنطقة");

    return;
  }

  if(areaPoints.length===0) return;

  areaPoints.pop();

  redrawTemporaryArea();

  showHint(
    "النقاط: "+
    areaPoints.length+
    " — أضف نقاطاً ثم اضغط ✓ إنهاء"
  );
}

function cancelSelection(){

  targetMode=null;

  areaPoints=[];

  if(areaLayer){
    intelMap.removeLayer(areaLayer);
    areaLayer=null;
  }

  clearRadiusOnly();

  setToolActive(null);

  hideHint();
}

function clearRadiusOnly(){

  if(radiusLayer){

    intelMap.removeLayer(radiusLayer);

    radiusLayer=null;
  }

  currentRadius=null;
}

function clearSelectionLayers(){

  if(areaLayer){
    intelMap.removeLayer(areaLayer);
    areaLayer=null;
  }

  if(radiusLayer){
    intelMap.removeLayer(radiusLayer);
    radiusLayer=null;
  }

  areaPoints=[];
}

/* =========================================================
   INTEL MARKER
   ========================================================= */

function updateIntelMarker(){

  if(intelTargetMarker){

    intelMap.removeLayer(intelTargetMarker);

    intelTargetMarker=null;
  }

  if(!target) return;

  intelTargetMarker=L.marker(
    [target.lat,target.lon]
  ).addTo(intelMap);

  if(target.type==="area" && target.polygon){

    if(areaLayer){
      intelMap.fitBounds(areaLayer.getBounds(),{
        padding:[40,40]
      });
    }

  }

  if(target.type==="radius" && radiusLayer){

    intelMap.fitBounds(radiusLayer.getBounds(),{
      padding:[40,40]
    });

  }
}

/* =========================================================
   AREA MATH
   ========================================================= */

function polygonArea(coords){

  if(coords.length<3) return 0;

  const R=6378137;

  let area=0;

  for(let i=0;i<coords.length;i++){

    const p1=coords[i];
    const p2=coords[(i+1)%coords.length];

    const lat1=p1[0]*Math.PI/180;
    const lat2=p2[0]*Math.PI/180;

    const lon1=p1[1]*Math.PI/180;
    const lon2=p2[1]*Math.PI/180;

    area +=
      (lon2-lon1)*
      (2+
      Math.sin(lat1)+
      Math.sin(lat2));
  }

  area=Math.abs(area)*R*R/2;

  return area;
}

function polygonCenter(coords){

  let lat=0;
  let lon=0;

  coords.forEach(p=>{
    lat+=p[0];
    lon+=p[1];
  });

  return[
    lat/coords.length,
    lon/coords.length
  ];
}

function formatArea(m2){

  if(!m2 || !isFinite(m2)) return "—";

  if(m2<10000){
    return Math.round(m2)+" m²";
  }

  if(m2<1000000){
    return (m2/10000).toFixed(2)+" ha";
  }

  return (m2/1000000).toFixed(2)+" km²";
}

function formatDistance(m){

  if(m<1000){
    return Math.round(m)+" m";
  }

  return (m/1000).toFixed(1)+" km";
}

/* =========================================================
   BUILDING ANALYSIS
   ========================================================= */

async function analyzeBuildings(){

  if(!target){

    showToast("حدد هدفاً أولاً");

    return;
  }

  document.getElementById("statBuildings")
    .textContent="...";

  logIntel("جارٍ تحليل المباني من OpenStreetMap...");

  let query="";

  if(target.type==="radius"){

    query=`
      [out:json][timeout:30];
      (
        way["building"](around:${target.radius},${target.lat},${target.lon});
        relation["building"](around:${target.radius},${target.lat},${target.lon});
      );
      out center tags;
    `;

  }else{

    const r=
      target.type==="area"?
      getAreaRadius(target.polygon):
      2000;

    query=`
      [out:json][timeout:30];
      (
        way["building"](around:${Math.max(r,1000)},${target.lat},${target.lon});
        relation["building"](around:${Math.max(r,1000)},${target.lat},${target.lon});
      );
      out center tags;
    `;
  }

  const servers=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let data=null;

  for(const server of servers){

    try{

      const response=await fetch(server,{
        method:"POST",
        headers:{
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body:"data="+encodeURIComponent(query)
      });

      if(!response.ok) continue;

      data=await response.json();

      if(data) break;

    }catch(e){
      console.log("Overpass failed",server,e);
    }
  }

  if(!data){

    document.getElementById("statBuildings")
      .textContent="N/A";

    logIntel(
      "تعذر الوصول إلى خادم المباني حالياً."
    );

    return;
  }

  let elements=data.elements||[];

  /*
    إذا كان الهدف منطقة:
    نفلتر مراكز المباني داخل المضلع تقريبياً.
  */

  if(target.type==="area"){

    elements=elements.filter(el=>{

      if(!el.center) return false;

      return pointInPolygon(
        [
          el.center.lat,
          el.center.lon
        ],
        target.polygon
      );
    });
  }

  if(buildingLayer){

    intelMap.removeLayer(buildingLayer);
  }

  buildingLayer=L.layerGroup().addTo(intelMap);

  elements.forEach(el=>{

    if(!el.center) return;

    const marker=L.circleMarker(
      [el.center.lat,el.center.lon],
      {
        radius:3,
        weight:1
      }
    );

    marker.bindPopup(
      "🏢 Building"+
      "<br>"+escapeHtml(
        el.tags?.name ||
        el.tags?.building ||
        "Unnamed"
      )
    );

    marker.addTo(buildingLayer);
  });

  document.getElementById("statBuildings")
    .textContent=elements.length.toLocaleString();

  logIntel(
    "Building Analysis: "+
    elements.length.toLocaleString()+
    " mapped buildings."
  );
}

function getAreaRadius(poly){

  const c=polygonCenter(poly);

  let max=0;

  poly.forEach(p=>{

    const d=haversine(
      c[0],c[1],
      p[0],p[1]
    );

    max=Math.max(max,d);
  });

  return Math.max(max*1.5,1000);
}

function pointInPolygon(point,polygon){

  const lat=point[0];
  const lon=point[1];

  let inside=false;

  for(
    let i=0,j=polygon.length-1;
    i<polygon.length;
    j=i++
  ){

    const xi=polygon[i][1];
    const yi=polygon[i][0];

    const xj=polygon[j][1];
    const yj=polygon[j][0];

    const intersect=
      ((yi>lat)!==(yj>lat)) &&
      (
        lon<
        (xj-xi)*
        (lat-yi)/
        (yj-yi)+xi
      );

    if(intersect) inside=!inside;
  }

  return inside;
}

/* =========================================================
   NASA EARTH EVENTS
   ========================================================= */

async function analyzeEvents(){

  if(!target){

    showToast("حدد هدفاً أولاً");

    return;
  }

  document.getElementById("statEvents")
    .textContent="...";

  logIntel(
    "جارٍ جلب الأحداث الطبيعية المفتوحة من NASA EONET..."
  );

  try{

    const url=
      "https://eonet.gsfc.nasa.gov/api/v3/events"+
      "?status=open&limit=100";

    const response=await fetch(url);

    const data=await response.json();

    const events=data.events||[];

    if(eventLayer){

      map.removeLayer(eventLayer);

      intelMap.removeLayer(eventLayer);
    }

    eventLayer=L.layerGroup();

    let count=0;

    events.forEach(event=>{

      const geo=event.geometry||
        [];

      if(!geo.length) return;

      const latest=geo[geo.length-1];

      if(!latest.coordinates) return;

      let lon;
      let lat;

      if(Array.isArray(latest.coordinates)){

        lon=parseFloat(latest.coordinates[0]);
        lat=parseFloat(latest.coordinates[1]);

      }else{
        return;
      }

      let relevant=false;

      if(target.type==="point"){

        const d=haversine(
          target.lat,
          target.lon,
          lat,
          lon
        );

        relevant=d<=100000;
      }

      if(target.type==="radius"){

        const d=haversine(
          target.lat,
          target.lon,
          lat,
          lon
        );

        relevant=d<=target.radius;
      }

      if(target.type==="area"){

        relevant=pointInPolygon(
          [lat,lon],
          target.polygon
        );
      }

      if(relevant){

        count++;

        const marker=L.circleMarker(
          [lat,lon],
          {
            radius:6,
            weight:2
          }
        );

        marker.bindPopup(
          "<strong>🌋 "+
          escapeHtml(event.title||"Natural Event")+
          "</strong>"+
          "<br>"+
          escapeHtml(event.categories?.map(
            x=>x.title
          ).join(", ")||"")+
          "<br><small>NASA EONET</small>"
        );

        marker.addTo(eventLayer);
      }
    });

    eventLayer.addTo(intelMap);

    document.getElementById("statEvents")
      .textContent=count;

    logIntel(
      "NASA EONET: "+
      count+
      " relevant open events found."
    );

  }catch(e){

    document.getElementById("statEvents")
      .textContent="N/A";

    logIntel(
      "تعذر تحميل أحداث NASA حالياً."
    );
  }
}

/* =========================================================

   ========================================================= */

function askTerra(command){

  const c=command.toLowerCase();

  if(
    c.includes("حلل")||
    c.includes("تحليل")||
    c.includes("analy")
  ){

    analyzeTarget();

    return;
  }

  if(
    c.includes("مبنى")||
    c.includes("مباني")||
    c.includes("building")
  ){

    analyzeBuildings();

    return;
  }

  if(
    c.includes("حدث")||
    c.includes("أحداث")||
    c.includes("زلزال")||
    c.includes("fire")||
    c.includes("event")
  ){

    analyzeEvents();

    return;
  }

  if(
    c.includes("المنطقة")||
    c.includes("رسمتها")||
    c.includes("area")
  ){

    if(target?.type==="area"){

      analyzeTarget();

    }else{

      showToast(
        "لا توجد منطقة مرسومة حالياً"
      );
    }

    return;
  }

  if(
    c.includes("تقرير")||
    c.includes("report")
  ){

    generateReport();

    return;
  }

  showToast(
    "ASK TERRA: لم أفهم الأمر بعد."
  );
}

/* =========================================================
   GPS
   ========================================================= */

function locateUser(){

  if(!navigator.geolocation){

    showToast("GPS غير مدعوم");

    return;
  }

  showToast("جارٍ تحديد موقعك...");

  navigator.geolocation.getCurrentPosition(

    pos=>{

      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      const acc=pos.coords.accuracy;

      if(userMarker){
        map.removeLayer(userMarker);
      }

      if(userCircle){
        map.removeLayer(userCircle);
      }

      userMarker=L.marker([lat,lon])
        .addTo(map)
        .bindPopup("📍 موقعك")
        .openPopup();

      userCircle=L.circle(
        [lat,lon],
        {
          radius:acc,
          fillOpacity:.08,
          weight:1
        }
      ).addTo(map);

      map.setView([lat,lon],15);

      setPointTarget(lat,lon,true);

    },

    err=>{

      showToast(
        "تعذر تحديد الموقع"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

/* =========================================================
   DISTANCE
   ========================================================= */

function haversine(lat1,lon1,lat2,lon2){

  const R=6371000;

  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;

  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;

  const a=
    Math.sin(dLat/2)**2+
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dLon/2)**2;

  return 2*R*Math.asin(Math.sqrt(a));
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
