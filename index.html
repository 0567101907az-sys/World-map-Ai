<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TERRA X</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  color:white;
  font-family:Arial,sans-serif;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

/* ================= TOP ================= */

.topbar{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:1000;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  background:rgba(5,8,13,.91);
  border:1px solid rgba(255,255,255,.11);
  border-radius:20px;

  backdrop-filter:blur(18px);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
}

.logo{
  min-width:82px;
  text-align:center;
}

.logoMain{
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
}

.logoSub{
  color:#7e899a;
  font-size:7px;
  letter-spacing:1px;
  margin-top:3px;
}

.search{
  flex:1;
  display:flex;
  gap:6px;
}

#searchInput{
  width:100%;
  min-width:0;

  padding:12px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;

  outline:none;

  background:rgba(255,255,255,.07);
  color:white;

  font-size:13px;
}

#searchInput::placeholder{
  color:#7f8999;
}

.searchBtn{
  width:44px;
  border:0;
  border-radius:13px;
  background:white;
  color:#05070b;
  font-size:20px;
}

/* ================= MODE SWITCH ================= */

.modeSwitch{
  position:fixed;
  top:84px;
  left:12px;
  right:12px;

  z-index:1000;

  display:flex;
  gap:7px;

  padding:6px;

  background:rgba(5,8,13,.88);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;

  backdrop-filter:blur(16px);
}

.modeBtn{
  flex:1;

  padding:10px 6px;

  border:0;
  border-radius:11px;

  background:transparent;
  color:#8993a4;

  font-size:11px;
  font-weight:bold;
}

.modeBtn.active{
  background:rgba(255,255,255,.13);
  color:white;
}

/* ================= MAP TYPE ================= */

.mapTypes{
  position:fixed;
  top:132px;
  right:12px;

  z-index:999;

  display:flex;
  flex-direction:column;
  gap:6px;
}

.mapType{
  padding:9px 11px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;

  background:rgba(5,8,13,.9);
  color:white;

  font-size:10px;

  backdrop-filter:blur(12px);
}

.mapType.active{
  background:white;
  color:#05070b;
}

/* ================= INTELLIGENCE ================= */

.intelPanel{
  position:fixed;

  top:174px;
  left:12px;
  right:12px;

  z-index:900;

  display:none;

  max-height:calc(100vh - 250px);
  overflow:auto;

  background:rgba(5,8,13,.91);
  border:1px solid rgba(255,255,255,.11);
  border-radius:20px;

  padding:13px;

  backdrop-filter:blur(20px);
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.intelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;
}

.intelTitle{
  font-size:16px;
  font-weight:900;
  letter-spacing:1px;
}

.intelLive{
  font-size:9px;
  color:#8f9aaa;
}

.close{
  border:0;
  background:transparent;
  color:#8791a1;
  font-size:17px;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:12px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;

  background:rgba(255,255,255,.045);
}

.statIcon{
  font-size:19px;
}

.statName{
  color:#8993a4;
  font-size:9px;
  margin-top:5px;
}

.statValue{
  font-size:16px;
  font-weight:bold;
  margin-top:3px;
}

/* ================= ACTIONS ================= */

.intelActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.action{
  padding:12px 7px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;

  background:rgba(255,255,255,.05);
  color:white;

  font-size:10px;
}

/* ================= RESULTS ================= */

.results{
  margin-top:10px;
}

.result{
  padding:10px;

  margin-bottom:6px;

  background:rgba(255,255,255,.045);
  border-radius:12px;

  font-size:11px;
}

.result small{
  display:block;
  color:#7f8999;
  margin-top:4px;
  line-height:1.5;
}

/* ================= BOTTOM ================= */

.bottom{
  position:fixed;

  left:10px;
  right:10px;
  bottom:10px;

  z-index:1000;

  background:rgba(5,8,13,.94);
  border:1px solid rgba(255,255,255,.1);
  border-radius:21px;

  padding:11px;

  backdrop-filter:blur(18px);
}

.handle{
  width:38px;
  height:4px;
  border-radius:10px;
  background:#555f70;
  margin:0 auto 10px;
}

.bottomGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.tool{
  padding:10px 3px;

  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;

  background:rgba(255,255,255,.045);
  color:white;

  font-size:9px;
}

.tool span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

/* ================= LOCATION ================= */

.locationBtn{
  position:fixed;

  right:18px;
  bottom:205px;

  z-index:999;

  width:49px;
  height:49px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;

  background:rgba(5,8,13,.92);
  color:white;

  font-size:21px;
}

/* ================= STATUS ================= */

.status{
  margin-top:9px;
  text-align:center;

  color:#7e899a;
  font-size:9px;
}

/* ================= LEAFLET ================= */

.leaflet-control-zoom{
  display:none;
}

.leaflet-control-attribution{
  font-size:7px;
}

</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="topbar">

  <div class="logo">
    <div class="logoMain">TERRA X</div>
    <div class="logoSub">SEE THE WORLD DIFFERENTLY</div>
  </div>

  <div class="search">

    <input
      id="searchInput"
      placeholder="ابحث عن مدينة أو مكان..."
    >

    <button class="searchBtn" onclick="searchPlace()">
      🔎
    </button>

  </div>

</div>


<!-- MODE -->

<div class="modeSwitch">

  <button
    id="mapModeBtn"
    class="modeBtn active"
    onclick="setMode('map')"
  >
    🗺️ الخريطة
  </button>

  <button
    id="intelModeBtn"
    class="modeBtn"
    onclick="setMode('intel')"
  >
    🛰️ INTELLIGENCE
  </button>

</div>


<!-- MAP TYPES -->

<div class="mapTypes">

  <button
    class="mapType active"
    id="streetBtn"
    onclick="changeMap('street')"
  >
    🗺️ شوارع
  </button>

  <button
    class="mapType"
    id="satelliteBtn"
    onclick="changeMap('satellite')"
  >
    🛰️ قمر صناعي
  </button>

  <button
    class="mapType"
    id="terrainBtn"
    onclick="changeMap('terrain')"
  >
    ⛰️ تضاريس
  </button>

</div>


<!-- INTELLIGENCE PANEL -->

<div class="intelPanel" id="intelPanel">

  <div class="intelHeader">

    <div>
      <div class="intelTitle">
        🛰️ TERRA X INTELLIGENCE
      </div>

      <div class="intelLive">
        GEOSPATIAL ANALYSIS
      </div>
    </div>

    <button
      class="close"
      onclick="setMode('map')"
    >
      ✕
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <div class="statIcon">👥</div>
      <div class="statName">POPULATION</div>
      <div class="statValue" id="populationValue">—</div>
    </div>

    <div class="stat">
      <div class="statIcon">🏠</div>
      <div class="statName">BUILDINGS</div>
      <div class="statValue" id="buildingValue">—</div>
    </div>

    <div class="stat">
      <div class="statIcon">📐</div>
      <div class="statName">AREA</div>
      <div class="statValue" id="areaValue">—</div>
    </div>

    <div class="stat">
      <div class="statIcon">📊</div>
      <div class="statName">DENSITY</div>
      <div class="statValue" id="densityValue">—</div>
    </div>

  </div>


  <div class="intelActions">

    <button class="action" onclick="populationAI()">
      👥 Population AI
    </button>

    <button class="action" onclick="satelliteCompare()">
      🔄 Satellite Compare
    </button>

    <button class="action" onclick="buildingAnalysis()">
      🏠 Buildings
    </button>

    <button class="action" onclick="vegetationAnalysis()">
      🌳 Vegetation
    </button>

  </div>


  <div class="results" id="results"></div>

  <div class="status" id="status">
    TERRA X READY
  </div>

</div>


<!-- LOCATION -->

<button
  class="locationBtn"
  onclick="getMyLocation()"
>
  📍
</button>


<!-- BOTTOM -->

<div class="bottom">

  <div class="handle"></div>

  <div class="bottomGrid">

    <button class="tool" onclick="setMode('intel')">
      <span>🛰️</span>
      Intelligence
    </button>

    <button class="tool" onclick="drawArea()">
      <span>✏️</span>
      تحديد منطقة
    </button>

    <button class="tool" onclick="populationAI()">
      <span>👥</span>
      السكان
    </button>

    <button class="tool" onclick="satelliteCompare()">
      <span>🔄</span>
      مقارنة
    </button>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   MAP
===================================================== */

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles © Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:13,
    attribution:"Tiles © Esri"
  }
);

const map = L.map("map",{
  center:[31.95,35.91],
  zoom:7,
  layers:[street]
});


/* =====================================================
   VARIABLES
===================================================== */

let currentLayer = street;

let markers = [];

let userLocation = null;

let userMarker = null;

let accuracyCircle = null;

let drawing = false;

let drawingPoints = [];

let drawingMarkers = [];

let areaPolygon = null;


/* =====================================================
   MAP SWITCH
===================================================== */

function changeMap(type){

  if(currentLayer){

    map.removeLayer(currentLayer);

  }

  if(type === "street"){

    currentLayer = street;

    street.addTo(map);

  }

  if(type === "satellite"){

    currentLayer = satellite;

    satellite.addTo(map);

  }

  if(type === "terrain"){

    currentLayer = terrain;

    terrain.addTo(map);

  }


  document
    .querySelectorAll(".mapType")
    .forEach(btn => btn.classList.remove("active"));


  if(type === "street")
    document.getElementById("streetBtn").classList.add("active");

  if(type === "satellite")
    document.getElementById("satelliteBtn").classList.add("active");

  if(type === "terrain")
    document.getElementById("terrainBtn").classList.add("active");

}


/* =====================================================
   MODES
===================================================== */

function setMode(mode){

  const mapBtn =
    document.getElementById("mapModeBtn");

  const intelBtn =
    document.getElementById("intelModeBtn");

  const panel =
    document.getElementById("intelPanel");


  if(mode === "map"){

    mapBtn.classList.add("active");

    intelBtn.classList.remove("active");

    panel.style.display = "none";

  }


  if(mode === "intel"){

    mapBtn.classList.remove("active");

    intelBtn.classList.add("active");

    panel.style.display = "block";

  }

}


/* =====================================================
   SEARCH
===================================================== */

async function searchPlace(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();


  if(!query) return;


  setMode("map");


  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2&limit=1&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(!data.length){

      alert("لم نجد هذا المكان.");

      return;

    }


    const place = data[0];

    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);


    map.setView(
      [lat,lon],
      14
    );


    clearMarkers();


    const marker =
      L.marker([lat,lon])
      .addTo(map);


    marker
      .bindPopup(
        "<b>📍 "+place.display_name+"</b>"
      )
      .openPopup();


    markers.push(marker);


  }catch(error){

    alert("حدث خطأ أثناء البحث.");

  }

}


/* =====================================================
   CLEAR MARKERS
===================================================== */

function clearMarkers(){

  markers.forEach(
    marker => map.removeLayer(marker)
  );

  markers=[];

}


/* =====================================================
   LOCATION
===================================================== */

function getMyLocation(){

  if(!navigator.geolocation){

    alert("تحديد الموقع غير مدعوم.");

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      userLocation =
        [lat,lon];


      if(userMarker)
        map.removeLayer(userMarker);


      if(accuracyCircle)
        map.removeLayer(accuracyCircle);


      userMarker =
        L.marker(userLocation)
        .addTo(map)
        .bindPopup("📍 موقعك الحالي");


      accuracyCircle =
        L.circle(
          userLocation,
          {
            radius:accuracy
          }
        )
        .addTo(map);


      map.setView(
        userLocation,
        15
      );


    },

    () => {

      alert(
        "لم نستطع تحديد موقعك. تأكد من إعطاء المتصفح إذن الموقع."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}


/* =====================================================
   DRAW AREA
===================================================== */

function drawArea(){

  drawing = true;

  drawingPoints = [];

  drawingMarkers.forEach(
    m => map.removeLayer(m)
  );

  drawingMarkers = [];


  if(areaPolygon){

    map.removeLayer(areaPolygon);

    areaPolygon = null;

  }


  setMode("intel");


  document.getElementById("status").innerText =
    "✏️ اضغط على الخريطة لإضافة نقاط المنطقة";


  map.once("click", addDrawingPoint);

}


/* =====================================================
   DRAW POINT
===================================================== */

function addDrawingPoint(e){

  if(!drawing) return;


  drawingPoints.push(
    [e.latlng.lat,e.latlng.lng]
  );


  const marker =
    L.circleMarker(
      e.latlng,
      {
        radius:6
      }
    ).addTo(map);


  drawingMarkers.push(marker);


  if(drawingPoints.length >= 3){

    if(areaPolygon)
      map.removeLayer(areaPolygon);


    areaPolygon =
      L.polygon(
        drawingPoints,
        {
          fillOpacity:.18
        }
      ).addTo(map);


    calculateArea();


    drawing = false;


    document.getElementById("status").innerText =
      "✅ تم تحديد المنطقة";

  }else{

    map.once("click", addDrawingPoint);

  }

}


/* =====================================================
   AREA CALCULATION
===================================================== */

function calculateArea(){

  if(!areaPolygon) return;


  const latlngs =
    areaPolygon.getLatLngs()[0];


  let area = 0;


  for(
    let i=0;
    i<latlngs.length;
    i++
  ){

    const p1 =
      latlngs[i];

    const p2 =
      latlngs[
        (i+1)%latlngs.length
      ];


    area +=
      (
        p2.lng-p1.lng
      ) *
      (
        p1.lat+p2.lat
      );

  }


  area =
    Math.abs(area) *
    12364 /
    2;


  document
    .getElementById("areaValue")
    .innerText =
      area.toFixed(2)+" km²";


  document
    .getElementById("status")
    .innerText =
      "📐 مساحة المنطقة: "+
      area.toFixed(2)+
      " km²";

}


/* =====================================================
   POPULATION AI
===================================================== */

function populationAI(){

  setMode("intel");


  document
    .getElementById("populationValue")
    .innerText = "—";


  document
    .getElementById("densityValue")
    .innerText = "—";


  document
    .getElementById("results")
    .innerHTML = `

      <div class="result">
        👥 POPULATION AI
        <small>
          سيعتمد النظام على مساحة المنطقة
          وبيانات السكان والكثافة المتاحة
          لإنتاج تقدير، وليس عدًّا مباشرًا للأشخاص.
        </small>
      </div>

      <div class="result">
        🛰️ Satellite Context
        <small>
          صور الأقمار الصناعية تساعد على فهم
          طبيعة المنطقة والعمران.
        </small>
      </div>

    `;


  document
    .getElementById("status")
    .innerText =
      "👥 بانتظار تحديد منطقة للتحليل";

}


/* =====================================================
   BUILDINGS
===================================================== */

function buildingAnalysis(){

  setMode("intel");


  document
    .getElementById("results")
    .innerHTML = `

      <div class="result">
        🏠 BUILDING ANALYSIS
        <small>
          المرحلة التالية ستربط TERRA X
          ببيانات المباني الحقيقية وتحلل
          الكثافة العمرانية.
        </small>
      </div>

    `;


  document
    .getElementById("buildingValue")
    .innerText = "—";

}


/* =====================================================
   VEGETATION
===================================================== */

function vegetationAnalysis(){

  setMode("intel");


  document
    .getElementById("results")
    .innerHTML = `

      <div class="result">
        🌳 VEGETATION ANALYSIS
        <small>
          سيتم لاحقًا حساب نسبة الغطاء النباتي
          من بيانات الاستشعار عن بعد المتاحة.
        </small>
      </div>

    `;

}


/* =====================================================
   SATELLITE COMPARE
===================================================== */

function satelliteCompare(){

  setMode("intel");


  document
    .getElementById("results")
    .innerHTML = `

      <div class="result">
        🔄 SATELLITE COMPARE
        <small>
          اختر منطقة ثم نقارن صور الأقمار
          الصناعية المتاحة عبر فترات زمنية مختلفة.
        </small>
      </div>

      <div class="result">
        📅 BEFORE
        <small>
          الصورة التاريخية المتاحة
        </small>
      </div>

      <div class="result">
        📅 AFTER
        <small>
          أحدث صورة متاحة
        </small>
      </div>

    `;


  changeMap("satellite");


  document
    .getElementById("status")
    .innerText =
      "🛰️ Satellite Compare جاهز للربط بمصدر الصور التاريخية";

}


/* =====================================================
   ENTER SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter")
        searchPlace();

    }
  );

</script>

</body>
                                                                </html>
