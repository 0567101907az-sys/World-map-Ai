<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WORLD MAP AI 2.0</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111c31;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #263653;
    }

    .subtitle {
      font-size: 13px;
      color: #9fb0c9;
      margin-top: 5px;
    }

    .search-box {
      padding: 15px;
      background: #0f192b;
    }

    #searchInput {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334563;
      background: #17243a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #searchInput::placeholder {
      color: #8b9ab2;
    }

    button {
      width: 100%;
      margin-top: 9px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchBtn {
      background: #2563eb;
    }

    #locationBtn {
      background: #16805c;
    }

    button:active {
      transform: scale(.98);
    }

    .examples {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
    }

    .example {
      white-space: nowrap;
      background: #1a2942;
      border: 1px solid #334563;
      color: #dbe7f8;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    #status {
      padding: 10px 15px;
      color: #9fb0c9;
      font-size: 14px;
      min-height: 38px;
    }

    #map {
      width: 100%;
      height: 58vh;
      min-height: 400px;
    }

    #results {
      padding: 15px;
    }

    .result {
      background: #131f34;
      border: 1px solid #263653;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .result:hover {
      background: #192943;
    }

    .result-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .result-info {
      color: #b3c0d3;
      font-size: 13px;
      line-height: 1.7;
    }

    .distance {
      color: #60d6a2;
      font-weight: bold;
    }

    .direction {
      color: #8db7ff;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #65758f;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  🌍 WORLD MAP AI
  <div class="subtitle">WORLD MAP AI 2.0 — خريطة ذكية للعالم</div>
</header>

<div class="search-box">

  <input
    id="searchInput"
    type="text"
    placeholder="مثال: مستشفيات نابلس أو جامعات لندن">

  <button id="searchBtn" onclick="smartSearch()">
    🔎 بحث ذكي
  </button>

  <button id="locationBtn" onclick="getMyLocation()">
    📍 موقعي الآن
  </button>

  <div class="examples">

    <div class="example"
         onclick="setSearch('مستشفيات نابلس')">
      🏥 مستشفيات نابلس
    </div>

    <div class="example"
         onclick="setSearch('جامعات لندن')">
      🎓 جامعات لندن
    </div>

    <div class="example"
         onclick="setSearch('مساجد القدس')">
      🕌 مساجد القدس
    </div>

    <div class="example"
         onclick="setSearch('مدارس نابلس')">
      🏫 مدارس نابلس
    </div>

    <div class="example"
         onclick="setSearch('مطاعم نابلس')">
      🍽️ مطاعم نابلس
    </div>

    <div class="example"
         onclick="setSearch('stadiums in Barcelona')">
      🏟️ ملاعب برشلونة
    </div>

  </div>
</div>

<div id="status">
  جاهز 🚀
</div>

<div id="map"></div>

<div id="results"></div>

<footer>
  WORLD MAP AI 2.0 — OpenStreetMap & Esri
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   الخرائط
===================================================== */

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 13,
    attribution: "Tiles &copy; Esri"
  }
);

const map = L.map("map", {
  center: [31.95, 35.91],
  zoom: 7,
  layers: [street]
});

L.control.layers(
  {
    "🗺️ الشوارع": street,
    "🛰️ قمر صناعي": satellite,
    "⛰️ تضاريس": terrain
  },
  null,
  {
    position: "topright"
  }
).addTo(map);


/* =====================================================
   المتغيرات
===================================================== */

let markers = [];

let userMarker = null;
let accuracyCircle = null;

let userLocation = null;


/* =====================================================
   أنواع الأماكن
===================================================== */

const categories = {

  hospital: [
    "مستشفى",
    "مستشفيات",
    "hospital",
    "hospitals"
  ],

  university: [
    "جامعة",
    "جامعات",
    "university",
    "universities"
  ],

  school: [
    "مدرسة",
    "مدارس",
    "school",
    "schools"
  ],

  mosque: [
    "مسجد",
    "مساجد",
    "mosque",
    "mosques"
  ],

  stadium: [
    "ملعب",
    "ملاعب",
    "stadium",
    "stadiums"
  ],

  police: [
    "شرطة",
    "مركز شرطة",
    "police"
  ],

  pharmacy: [
    "صيدلية",
    "صيدليات",
    "pharmacy",
    "pharmacies"
  ],

  hotel: [
    "فندق",
    "فنادق",
    "hotel",
    "hotels"
  ],

  restaurant: [
    "مطعم",
    "مطاعم",
    "restaurant",
    "restaurants"
  ],

  airport: [
    "مطار",
    "مطارات",
    "airport",
    "airports"
  ]
};


/* =====================================================
   تنظيف العلامات
===================================================== */

function clearMarkers() {

  markers.forEach(function(marker) {
    map.removeLayer(marker);
  });

  markers = [];
}


/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   معرفة نوع المكان
===================================================== */

function findCategory(text) {

  const lower = text.toLowerCase();

  for (const category in categories) {

    for (const word of categories[category]) {

      if (lower.includes(word.toLowerCase())) {
        return category;
      }

    }
  }

  return null;
}


/* =====================================================
   OSM TAGS
===================================================== */

function getTags(category) {

  if (category === "hospital")
    return ['[amenity="hospital"]'];

  if (category === "university")
    return ['[amenity="university"]'];

  if (category === "school")
    return ['[amenity="school"]'];

  if (category === "mosque")
    return [
      '[amenity="place_of_worship"][religion="muslim"]',
      '[amenity="place_of_worship"]'
    ];

  if (category === "stadium")
    return ['[leisure="stadium"]'];

  if (category === "police")
    return ['[amenity="police"]'];

  if (category === "pharmacy")
    return ['[amenity="pharmacy"]'];

  if (category === "hotel")
    return ['[tourism="hotel"]'];

  if (category === "restaurant")
    return ['[amenity="restaurant"]'];

  if (category === "airport")
    return ['[aeroway="aerodrome"]'];

  return [];
}


/* =====================================================
   تحديد موقع مدينة
===================================================== */

async function geocode(placeName) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(placeName);

  const response = await fetch(url, {
    headers: {
      "Accept": "application/json"
    }
  });

  if (!response.ok) {
    throw new Error("Geocoding failed");
  }

  const data = await response.json();

  if (!data.length) {
    return null;
  }

  return {
    lat: parseFloat(data[0].lat),
    lon: parseFloat(data[0].lon),
    display: data[0].display_name
  };
}


/* =====================================================
   البحث في Overpass
===================================================== */

async function searchPlaces(lat, lon, tags) {

  const servers = [

    "https://overpass-api.de/api/interpreter",

    "https://overpass.kumi.systems/api/interpreter"

  ];

  for (const server of servers) {

    try {

      let queryParts = [];

      tags.forEach(function(tag) {

        queryParts.push(
          `node(around:10000,${lat},${lon})${tag};`
        );

        queryParts.push(
          `way(around:10000,${lat},${lon})${tag};`
        );

        queryParts.push(
          `relation(around:10000,${lat},${lon})${tag};`
        );

      });

      const query = `
        [out:json][timeout:25];
        (
          ${queryParts.join("\n")}
        );
        out center tags;
      `;

      const response = await fetch(server, {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body:
          "data=" +
          encodeURIComponent(query)
      });

      if (!response.ok) {
        continue;
      }

      const data = await response.json();

      return data.elements || [];

    } catch (error) {

      console.log(
        "Overpass failed:",
        server
      );

    }
  }

  throw new Error(
    "All Overpass servers failed"
  );
}


/* =====================================================
   المسافة بين نقطتين
   Haversine
===================================================== */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =====================================================
   اتجاه المكان
===================================================== */

function getDirection(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const y =
    Math.sin(dLon) *
    Math.cos(lat2 * Math.PI / 180);

  const x =
    Math.cos(lat1 * Math.PI / 180) *
    Math.sin(lat2 * Math.PI / 180) -

    Math.sin(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.cos(dLon);

  let bearing =
    Math.atan2(y, x) *
    180 / Math.PI;

  bearing =
    (bearing + 360) % 360;


  if (bearing >= 337.5 || bearing < 22.5)
    return "⬆️ شمال";

  if (bearing < 67.5)
    return "↗️ شمال شرق";

  if (bearing < 112.5)
    return "➡️ شرق";

  if (bearing < 157.5)
    return "↘️ جنوب شرق";

  if (bearing < 202.5)
    return "⬇️ جنوب";

  if (bearing < 247.5)
    return "↙️ جنوب غرب";

  if (bearing < 292.5)
    return "⬅️ غرب";

  return "↖️ شمال غرب";
}


/* =====================================================
   موقعي الآن
===================================================== */

function getMyLocation() {

  const status =
    document.getElementById("status");

  if (!navigator.geolocation) {

    status.innerText =
      "❌ جهازك لا يدعم تحديد الموقع.";

    return;
  }

  status.innerText =
    "📍 جاري تحديد موقعك...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      userLocation = {
        lat: lat,
        lon: lon
      };


      // إزالة الموقع القديم
      if (userMarker) {
        map.removeLayer(userMarker);
      }

      if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
      }


      // دائرة الدقة
      accuracyCircle =
        L.circle(
          [lat, lon],
          {
            radius: accuracy,
            weight: 2,
            fillOpacity: 0.12
          }
        ).addTo(map);


      // علامة المستخدم
      userMarker =
        L.marker(
          [lat, lon]
        ).addTo(map);


      userMarker.bindPopup(
        "<b>📍 أنت هنا</b><br>" +
        "دقة تقريبية: " +
        Math.round(accuracy) +
        " متر"
      ).openPopup();


      map.setView(
        [lat, lon],
        15
      );


      status.innerText =
        "✅ تم تحديد موقعك بنجاح 📍";


      // تحديث المسافات إذا كانت النتائج موجودة
      updateDistances();

    },

    function(error) {

      let message =
        "❌ لم أستطع تحديد موقعك.";

      if (error.code === 1) {
        message =
          "⚠️ اسمح للموقع من المتصفح حتى أقدر أحدد مكانك.";
      }

      if (error.code === 2) {
        message =
          "⚠️ تعذر الحصول على موقعك حالياً.";
      }

      if (error.code === 3) {
        message =
          "⚠️ انتهى وقت تحديد الموقع.";
      }

      status.innerText = message;

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}


/* =====================================================
   تحديث المسافات
===================================================== */

function updateDistances() {

  if (!userLocation) {
    return;
  }

  const resultElements =
    document.querySelectorAll(".result");


  resultElements.forEach(function(div) {

    const lat =
      parseFloat(
        div.dataset.lat
      );

    const lon =
      parseFloat(
        div.dataset.lon
      );

    if (
      isNaN(lat) ||
      isNaN(lon)
    ) {
      return;
    }


    const distance =
      calculateDistance(
        userLocation.lat,
        userLocation.lon,
        lat,
        lon
      );


    const direction =
      getDirection(
        userLocation.lat,
        userLocation.lon,
        lat,
        lon
      );


    const info =
      div.querySelector(".distanceInfo");


    if (info) {

      info.innerHTML =
        `<span class="distance">
          📏 ${formatDistance(distance)}
        </span>
        &nbsp;
        <span class="direction">
          ${direction}
        </span>`;

    }

  });


  sortResultsByDistance();
}


/* =====================================================
   تنسيق المسافة
===================================================== */

function formatDistance(distance) {

  if (distance < 1) {

    return Math.round(
      distance * 1000
    ) + " متر";

  }

  return distance.toFixed(2) + " كم";
}


/* =====================================================
   ترتيب النتائج حسب القرب
===================================================== */

function sortResultsByDistance() {

  if (!userLocation) {
    return;
  }

  const container =
    document.getElementById("results");

  const items =
    Array.from(
      container.querySelectorAll(".result")
    );


  items.sort(function(a, b) {

    const distanceA =
      calculateDistance(
        userLocation.lat,
        userLocation.lon,
        parseFloat(a.dataset.lat),
        parseFloat(a.dataset.lon)
      );

    const distanceB =
      calculateDistance(
        userLocation.lat,
        userLocation.lon,
        parseFloat(b.dataset.lat),
        parseFloat(b.dataset.lon)
      );

    return distanceA - distanceB;

  });


  items.forEach(function(item, index) {

    const title =
      item.querySelector(".result-title");

    if (title) {

      const original =
        title.dataset.originalName;

      title.innerHTML =
        `${index + 1}. ${escapeHTML(original)}`;

    }

    container.appendChild(item);

  });
}


/* =====================================================
   البحث الذكي
===================================================== */

async function smartSearch() {

  const input =
    document
      .getElementById("searchInput")
      .value
      .trim();

  const status =
    document.getElementById("status");

  const results =
    document.getElementById("results");


  if (!input) {

    status.innerText =
      "اكتب شيئاً للبحث 🔎";

    return;
  }


  clearMarkers();

  results.innerHTML = "";

  status.innerText =
    "🧠 جاري فهم طلبك...";


  try {

    const category =
      findCategory(input);


    /* ---------------------------------------------
       بحث عن مكان عادي
    --------------------------------------------- */

    if (!category) {

      const place =
        await geocode(input);


      if (!place) {

        status.innerText =
          "❌ لم أجد هذا المكان.";

        return;
      }


      map.setView(
        [place.lat, place.lon],
        13
      );


      const marker =
        L.marker([
          place.lat,
          place.lon
        ]).addTo(map);


      marker.bindPopup(
        "<b>" +
        escapeHTML(place.display) +
        "</b>"
      );


      markers.push(marker);


      status.innerText =
        "📍 تم العثور على المكان.";

      return;
    }


    /* ---------------------------------------------
       استخراج اسم المنطقة
    --------------------------------------------- */

    let locationText = input;


    for (
      const wordList
      of Object.values(categories)
    ) {

      wordList.forEach(function(word) {

        const regex =
          new RegExp(
            word.replace(
              /[.*+?^${}()|[\]\\]/g,
              "\\$&"
            ),
            "gi"
          );

        locationText =
          locationText.replace(
            regex,
            ""
          );

      });

    }


    locationText =
      locationText
        .replace(/\bفي\b/gi, "")
        .replace(/\bحول\b/gi, "")
        .replace(/\bnear\b/gi, "")
        .replace(/\bin\b/gi, "")
        .replace(/\bof\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();


    if (!locationText) {

      status.innerText =
        "⚠️ اكتب اسم المدينة أو المنطقة.";

      return;
    }


    /* ---------------------------------------------
       تحديد المدينة
    --------------------------------------------- */

    status.innerText =
      "🌍 أبحث عن " +
      locationText +
      "...";


    const place =
      await geocode(locationText);


    if (!place) {

      status.innerText =
        "❌ لم أجد المنطقة المطلوبة.";

      return;
    }


    /* ---------------------------------------------
       البحث عن الأماكن
    --------------------------------------------- */

    status.innerText =
      "🔎 أبحث عن الأماكن الحقيقية...";


    const tags =
      getTags(category);


    let elements =
      await searchPlaces(
        place.lat,
        place.lon,
        tags
      );


    /* ---------------------------------------------
       إزالة التكرار
    --------------------------------------------- */

    const unique =
      new Map();


    elements.forEach(function(element) {

      const name =
        element.tags &&
        element.tags.name
          ? element.tags.name
          : "مكان بدون اسم";


      const lat =
        element.lat !== undefined
          ? element.lat
          : element.center?.lat;


      const lon =
        element.lon !== undefined
          ? element.lon
          : element.center?.lon;


      if (
        lat !== undefined &&
        lon !== undefined
      ) {

        const key =
          name +
          "|" +
          lat +
          "|" +
          lon;


        unique.set(
          key,
          {
            name: name,
            lat: lat,
            lon: lon,
            tags: element.tags || {}
          }
        );

      }

    });


    elements =
      Array.from(unique.values());


    /* ---------------------------------------------
       ترتيب أولي حسب موقع البحث
    --------------------------------------------- */

    elements.sort(function(a, b) {

      const da =
        calculateDistance(
          place.lat,
          place.lon,
          a.lat,
          a.lon
        );

      const db =
        calculateDistance(
          place.lat,
          place.lon,
          b.lat,
          b.lon
        );

      return da - db;

    });


    /* ---------------------------------------------
       لا توجد نتائج
    --------------------------------------------- */

    if (!elements.length) {

      status.innerText =
        "😕 لم أجد نتائج قريبة.";

      map.setView(
        [place.lat, place.lon],
        12
      );

      return;
    }


    /* ---------------------------------------------
       عرض النتائج
    --------------------------------------------- */

    const bounds = [];


    elements.forEach(function(item, index) {

      const marker =
        L.marker([
          item.lat,
          item.lon
        ]).addTo(map);


      marker.bindPopup(
        "<b>" +
        escapeHTML(item.name) +
        "</b><br><br>" +
        "📍 " +
        item.lat.toFixed(5) +
        ", " +
        item.lon.toFixed(5)
      );


      markers.push(marker);


      bounds.push([
        item.lat,
        item.lon
      ]);


      /* -------------------------------------------
         النتيجة في القائمة
      ------------------------------------------- */

      const div =
        document.createElement("div");


      div.className =
        "result";


      div.dataset.lat =
        item.lat;

      div.dataset.lon =
        item.lon;


      let distanceHTML =
        `<span class="distanceInfo">
          📍 موقع النتيجة
        </span>`;


      if (userLocation) {

        const distance =
          calculateDistance(
            userLocation.lat,
            userLocation.lon,
            item.lat,
            item.lon
          );


        const direction =
          getDirection(
            userLocation.lat,
            userLocation.lon,
            item.lat,
            item.lon
          );


        distanceHTML =
          `<span class="distanceInfo">
            <span class="distance">
              📏 ${formatDistance(distance)}
            </span>
            &nbsp;
            <span class="direction">
              ${direction}
            </span>
          </span>`;

      }


      div.innerHTML = `

        <div class="result-title">
          ${index + 1}. ${escapeHTML(item.name)}
        </div>

        <div class="result-info">
          📍 ${item.lat.toFixed(5)},
          ${item.lon.toFixed(5)}
        </div>

        <div class="result-info">
          ${distanceHTML}
        </div>

      `;


      const title =
        div.querySelector(".result-title");

      title.dataset.originalName =
        item.name;


      /* -------------------------------------------
         الضغط على النتيجة
      ------------------------------------------- */

      div.onclick = function() {

        map.setView(
          [item.lat, item.lon],
          17
        );

        marker.openPopup();

      };


      results.appendChild(div);

    });


    /* ---------------------------------------------
       إذا كان لدينا موقع المستخدم
    --------------------------------------------- */

    if (userLocation) {

      sortResultsByDistance();

    }


    /* ---------------------------------------------
       تكبير الخريطة
    --------------------------------------------- */

    if (bounds.length === 1) {

      map.setView(
        bounds[0],
        15
      );

    } else {

      map.fitBounds(
        bounds,
        {
          padding: [40, 40]
        }
      );

    }


    status.innerText =
      "✅ وجدت " +
      elements.length +
      " نتيجة حقيقية حول " +
      locationText;


  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ حدث خطأ أثناء البحث. حاول مرة أخرى.";

  }

}
